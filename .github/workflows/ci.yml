name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # weekly: catch packages renamed or dropped upstream, and new advisories

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # multilib: the gaming modules use it, and Bindle enables it on the target.
      - run: |
          grep -q '^\[multilib\]' /etc/pacman.conf ||
            printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm --needed rust rust-musl git python cargo-deny
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --check
      - run: cargo deny --locked check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Static build (the ISO binary)
        run: cargo build --release --locked -p bindle-cli --target x86_64-unknown-linux-musl
      - run: bash -n install.sh && python -m py_compile packaging/archinstall/bindle_plugin.py
      - run: pacman -Fy --noconfirm && python scripts/check-packages.py --aur

  gui:
    # The desktop wizard (Qt 6 + Kirigami): clippy, tests, and every screen
    # rendered offscreen in each uQ theme fixture.
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed rust git qt6-base qt6-declarative kirigami ttf-dejavu
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo clippy -p bindle-gui --all-targets --locked -- -D warnings
      - run: cargo test -p bindle-gui --locked
      - run: make gui-shots
      - name: Every screenshot was written
        # 6 shots x 5 theme runs, plus the applied run (those 6, 6-applied, 6b-applied-details).
        run: test "$(find dist/shots -name '*.png' | wc -l)" -eq 38

  msrv:
    # rust-version in Cargo.toml is a promise; build with exactly that toolchain.
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed rustup git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" check --all-targets --locked
