name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # weekly: catch packages renamed or dropped upstream, and new advisories

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # multilib: the gaming modules use it, and Bindle enables it on the target.
      - run: |
          grep -q '^\[multilib\]' /etc/pacman.conf ||
            printf '\n[multilib]\nInclude = /etc/pacman.d/mirrorlist\n' >> /etc/pacman.conf
          pacman -Syu --noconfirm --needed rust rust-musl git python cargo-deny
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --check
      - run: cargo deny --locked check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Static build (the ISO binary)
        run: cargo build --release --locked -p bindle-cli --target x86_64-unknown-linux-musl
      - run: bash -n install.sh && python -m py_compile packaging/archinstall/bindle_plugin.py
      - run: pacman -Fy --noconfirm && python scripts/check-packages.py --aur
      - name: Pinned releases are stable and CI-green
        run: python scripts/check-pins.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

  gui:
    # The desktop wizard (Qt 6 + Kirigami): clippy, tests, and every screen
    # rendered offscreen in each uQ theme fixture.
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed rust git qt6-base qt6-declarative kirigami ttf-dejavu
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo clippy -p bindle-gui --all-targets --locked -- -D warnings
      - run: cargo test -p bindle-gui --locked
      - run: make gui-shots
      - name: Every screenshot was written
        # Every theme run wrote the same, non-empty set of screens (a run that
        # stopped early writes fewer), and the sandboxed apply reached its end.
        run: |
          ref=$(ls dist/shots/none | sort)
          test -n "$ref"
          for d in dist/shots/*/; do
            [ "$d" = dist/shots/applied/ ] && continue
            [ "$(ls "$d" | sort)" = "$ref" ] || { echo "$d differs from dist/shots/none"; exit 1; }
          done
          test -f dist/shots/applied/6-applied.png
          test -f dist/shots/applied/6b-applied-details.png

  uq:
    # uQ Settings' Bindle page (uq/): its QML tests with a fake uQ context, its Node tests, and
    # uqctl's own check of the uq/ folder.
    runs-on: ubuntu-24.04
    env:
      # The uQ release whose `uqctl` and settings page test kit this repo follows (uq_api 3).
      UQ_TAG: v0.3.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Qt Quick and qmltestrunner
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools qml6-module-qtquick \
            qml6-module-qtquick-layouts qml6-module-qtquick-controls qml6-module-qttest qml6-module-qtqml-workerscript \
            qml6-module-qtquick-window qml6-module-qtquick-templates
      - name: Settings page
        run: QT_QPA_PLATFORM=offscreen /usr/lib/qt6/bin/qmltestrunner -import tests/uq/stub -input tests/uq/tst_page.qml
      - name: Page logic and manifest
        run: node --test 'tests/uq/*.test.mjs'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Cache uqctl
        id: uqctl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.uq
          key: uqctl-${{ env.UQ_TAG }}
      - name: Build uqctl
        if: steps.uqctl.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/asafelobotomy/uq --tag "$UQ_TAG" uqctl --root "$HOME/.uq"
      # `--no-programs` skips only the "program exists" check: bindle isn't installed here.
      - name: uQ integration check
        run: ~/.uq/bin/uqctl integrations check --no-programs uq/

  msrv:
    # rust-version in Cargo.toml is a promise; build with exactly that toolchain.
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed rustup git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" check --all-targets --locked
