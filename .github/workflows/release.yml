name: release
on:
  push:
    tags: ['v*']
  # Manual run: rebuilds an existing tag as a workflow artifact (never publishes).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (e.g. v0.1.0)
        required: true

permissions:
  contents: read

env:
  # Pinned so a release doesn't change with whatever Arch shipped that day.
  RUST_VERSION: '1.99.1'
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
    steps:
      # musl target: the ISO binary must be fully static so it runs on any ISO's glibc.
      - run: |
          pacman -Syu --noconfirm --needed rustup git curl python file
          rustup toolchain install "$RUST_VERSION" --profile minimal --target x86_64-unknown-linux-musl
          rustup default "$RUST_VERSION"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Versions agree (tag, VERSION, Cargo)
        shell: bash
        run: |
          v=$(cat VERSION)
          cargo metadata --no-deps --format-version 1 | python -c "import json,sys; v=sys.argv[1]; assert all(p['version']==v for p in json.load(sys.stdin)['packages']), 'Cargo version != VERSION'" "$v"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a release tag: $TAG"; exit 1; }
          [ "${TAG#v}" = "$v" ] || { echo "tag $TAG != VERSION $v"; exit 1; }
      - run: cargo test --workspace --locked
      - name: Static binary for the live ISO
        run: |
          cargo build --release --locked -p bindle-cli --target x86_64-unknown-linux-musl
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/bindle dist/bindle-x86_64
          file dist/bindle-x86_64 | grep -q 'static' || { echo "binary is not static"; exit 1; }
          (cd dist && sha256sum bindle-x86_64 > bindle-x86_64.sha256)
          cp install.sh dist/install.sh
      - name: AppImage
        run: packaging/appimage/build-appimage.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: bindle-dist
          path: dist/*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
