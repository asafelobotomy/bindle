name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
    steps:
      # rust-musl: the ISO binary must be fully static so it runs on any ISO's glibc.
      - run: pacman -Syu --noconfirm --needed rust rust-musl git curl python file
      - uses: actions/checkout@v5
      - name: Versions agree (tag, VERSION, Cargo)
        run: |
          v=$(cat VERSION)
          cargo metadata --no-deps --format-version 1 | python -c "import json,sys; v=sys.argv[1]; assert all(p['version']==v for p in json.load(sys.stdin)['packages']), 'Cargo version != VERSION'" "$v"
          case "$GITHUB_REF" in refs/tags/*) [ "${GITHUB_REF_NAME#v}" = "$v" ] || { echo "tag $GITHUB_REF_NAME != VERSION $v"; exit 1; } ;; esac
      - run: cargo test --workspace --locked
      - name: Static binary for the live ISO
        run: |
          cargo build --release --locked -p bindle-cli --target x86_64-unknown-linux-musl
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/bindle dist/bindle-x86_64
          file dist/bindle-x86_64 | grep -q 'static' || { echo "binary is not static"; exit 1; }
          (cd dist && sha256sum bindle-x86_64 > bindle-x86_64.sha256)
          cp install.sh dist/install.sh
      - name: AppImage
        run: packaging/appimage/build-appimage.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: bindle-dist
          path: dist/*
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
