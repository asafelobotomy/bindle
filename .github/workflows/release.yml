name: release
on:
  push:
    tags: ['v*']
  # Manual run: rebuilds an existing tag. The files are a workflow artifact;
  # they are signed only when the input names a real tag, and published only
  # with `publish` as well (e.g. to redo a release whose run failed).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (e.g. v0.1.0)
        required: true
      publish:
        description: Sign and publish the GitHub release for that tag
        type: boolean
        default: false

# Three jobs so the signing key never shares a machine with the build's
# dependencies (see SECURITY.md, "How releases are made"):
#   build   — read-only token, no persisted credentials; builds, tests, uploads dist/
#   sign    — fresh runner, no checkout, no cargo; writes SHA256SUMS + VERSION, signs
#   publish — the only job that can write to the repository; creates the release
permissions:
  contents: read

env:
  # Pinned so a release doesn't change with whatever Arch shipped that day.
  RUST_VERSION: '1.99.1'
  # The release signing key (public half: packaging/bindle-release.asc, also
  # embedded in install.sh). The private half is the BINDLE_GPG_KEY secret.
  SIGNING_FPR: 75C40FA127FBF8D4FBF9E710FAC40EFFE02D69FC
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    # archlinux:base-devel, pinned by digest (the multi-arch index) so a
    # release builds in a known image. Update with:
    #   skopeo inspect --raw docker://docker.io/library/archlinux:base-devel | sha256sum
    container: archlinux:base-devel@sha256:fa2d4ce3310ddd90a4208e5168be8ad367da5129af1245f38fd2d803bcbe3239
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      release: ${{ steps.tag.outputs.release }}
    steps:
      # musl target: the ISO binary must be fully static so it runs on any ISO's glibc.
      - run: |
          pacman -Syu --noconfirm --needed rustup git curl python file desktop-file-utils \
            qt6-base qt6-declarative kirigami
          rustup toolchain install "$RUST_VERSION" --profile minimal --target x86_64-unknown-linux-musl
          rustup default "$RUST_VERSION"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Release tag
        id: tag
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a release tag: $TAG"; exit 1; }
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          release=false
          # A real tag, and the commit checked out is the one it names (not a
          # branch that happens to share its name).
          if commit=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}") \
              && [ "$commit" = "$(git rev-parse HEAD)" ]; then
            release=true
          else
            echo "::warning::$TAG is not a tag here; building only (no signature, no release)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - name: Versions agree (tag, VERSION, Cargo)
        shell: bash
        run: |
          v=$(cat VERSION)
          cargo metadata --no-deps --format-version 1 | python -c "import json,sys; v=sys.argv[1]; assert all(p['version']==v for p in json.load(sys.stdin)['packages']), 'Cargo version != VERSION'" "$v"
          [ "${TAG#v}" = "$v" ] || { echo "tag $TAG != VERSION $v"; exit 1; }
      - run: cargo test --workspace --locked
      - name: Static binary for the live ISO
        run: |
          cargo build --release --locked -p bindle-cli --target x86_64-unknown-linux-musl
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/bindle dist/bindle-x86_64
          file dist/bindle-x86_64 | grep -q 'static' || { echo "binary is not static"; exit 1; }
          (cd dist && sha256sum bindle-x86_64 > bindle-x86_64.sha256)
          cp install.sh dist/install.sh
      - name: Desktop window (links the system's Qt 6 and Kirigami)
        run: |
          cargo build --release --locked -p bindle-gui
          cp target/release/bindle-gui dist/bindle-gui-x86_64
      - name: AppImage
        run: packaging/appimage/build-appimage.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindle-dist
          path: dist/*
          if-no-files-found: error

  sign:
    needs: build
    if: needs.build.outputs.release == 'true' && (github.event_name == 'push' || inputs.publish)
    # A fresh runner: nothing from the build ran here. No checkout, no cargo.
    runs-on: ubuntu-latest
    # Holds BINDLE_GPG_KEY once the maintainer moves it there (with required
    # reviewers); until then the repository secret reaches this job too.
    environment: release
    permissions: {}
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bindle-dist
          path: dist
      - name: VERSION, SHA256SUMS and the signature
        shell: bash
        env:
          BINDLE_GPG_KEY: ${{ secrets.BINDLE_GPG_KEY }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a release tag: $TAG"; exit 1; }
          [ -n "$BINDLE_GPG_KEY" ] || { echo "BINDLE_GPG_KEY secret is missing"; exit 1; }
          cd dist
          v="${TAG#v}"
          for f in bindle-x86_64 bindle-x86_64.sha256 bindle-gui-x86_64 install.sh \
              Bindle-x86_64.AppImage "Bindle-$v-x86_64.AppImage"; do
            [ -f "$f" ] || { echo "the build left out $f"; exit 1; }
          done
          sha256sum -c --quiet bindle-x86_64.sha256
          # install.sh must embed the key that signs.
          grep -q "$SIGNING_FPR" install.sh
          # The tag, signed with the files: an old release can't pass for a newer one.
          printf '%s\n' "$TAG" > VERSION
          sha256sum bindle-x86_64 bindle-gui-x86_64 install.sh VERSION *.AppImage > SHA256SUMS
          export GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$BINDLE_GPG_KEY" | gpg --batch --quiet --import
          gpg --batch --yes --local-user "$SIGNING_FPR" --output SHA256SUMS.sig --detach-sign SHA256SUMS
          # The secret must be the key users verify against: the fingerprint
          # is a hash of the public key, so this checks it is that key.
          gpg --batch --export "$SIGNING_FPR" > "$RUNNER_TEMP/release.gpg"
          gpgv --status-fd 1 --keyring "$RUNNER_TEMP/release.gpg" SHA256SUMS.sig SHA256SUMS | grep -q "VALIDSIG $SIGNING_FPR "
          rm -f "$RUNNER_TEMP/release.gpg"
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindle-signed
          path: |
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/VERSION
          if-no-files-found: error

  publish:
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bindle-dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bindle-signed
          path: dist
      - name: Files match the signed SHA256SUMS
        working-directory: dist
        run: sha256sum -c --strict SHA256SUMS
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true
