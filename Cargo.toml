[workspace]
resolver = "3"
members = ["crates/bindle-core", "crates/bindle-run", "crates/bindle-cli", "crates/bindle-gui"]
# bindle-gui needs Qt 6 and Kirigami to build; plain `cargo build` / `cargo test`
# skip it. Build it with `make gui` or `cargo build -p bindle-gui`.
default-members = ["crates/bindle-core", "crates/bindle-run", "crates/bindle-cli"]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
