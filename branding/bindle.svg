<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <clipPath id="tile"><rect width="256" height="256" rx="56"/></clipPath>
    <radialGradient id="bg" cx="0.25" cy="0.2" r="1"><stop offset="0" stop-color="#2b3244"/><stop offset="1" stop-color="#171b24"/></radialGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#53627d"/><stop offset="0.5" stop-color="#3e4a5f"/><stop offset="1" stop-color="#2a3242"/></linearGradient>
    <radialGradient id="hair" cx="0.65" cy="0.3" r="0.8"><stop offset="0" stop-color="#4f3e32"/><stop offset="1" stop-color="#2a201a"/></radialGradient>
    <linearGradient id="crown" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#86694f"/><stop offset="1" stop-color="#4f3c2d"/></linearGradient>
    <linearGradient id="brim" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6c5441"/><stop offset="1" stop-color="#3f3024"/></linearGradient>
    <linearGradient id="skin" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d49a73"/><stop offset="1" stop-color="#a86f4e"/></linearGradient>
    <radialGradient id="cast" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#000" stop-opacity="0.5"/><stop offset="0.7" stop-color="#000" stop-opacity="0.25"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <radialGradient id="bag" cx="0.35" cy="0.3" r="0.75" fx="0.3" fy="0.25"><stop offset="0" stop-color="#f07a6a"/><stop offset="0.55" stop-color="#d94f4f"/><stop offset="1" stop-color="#9e3434"/></radialGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0.45" stop-color="#5a1a1a" stop-opacity="0"/><stop offset="1" stop-color="#5a1a1a" stop-opacity="0.45"/></linearGradient>
    <linearGradient id="knot" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e86060"/><stop offset="1" stop-color="#a83a3a"/></linearGradient>
    <radialGradient id="dot" cx="0.35" cy="0.3" r="0.7"><stop offset="0" stop-color="#fff4e2"/><stop offset="1" stop-color="#dcc4a0"/></radialGradient>
    <linearGradient id="stick" gradientUnits="userSpaceOnUse" x1="93.5" y1="39.7" x2="114.5" y2="28.3"><stop offset="0" stop-color="#6e4724"/><stop offset="0.45" stop-color="#b9824a"/><stop offset="0.6" stop-color="#c8935a"/><stop offset="1" stop-color="#7a5029"/></linearGradient>
    <radialGradient id="grain" cx="0.45" cy="0.4" r="0.6"><stop offset="0" stop-color="#ecc48f"/><stop offset="1" stop-color="#c08a52"/></radialGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <!-- a traveller from behind, in from the right; light from the top left -->
    <g transform="matrix(-1 0 0 1 256 0)">
      <path d="M38 160h30l4 34H34z" fill="url(#skin)"/>
      <path d="M-12 256V190c22-8 40-10 52-10 6 8 18 8 24 0 40 0 80 6 112 22 30 14 50 38 58 56z" fill="url(#coat)"/>
      <path d="M36 182c6 10 26 10 32 0" fill="none" stroke="#252d3b" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="12" cy="134" rx="9" ry="15" fill="url(#skin)"/>
      <ellipse cx="92" cy="134" rx="9" ry="15" fill="url(#skin)"/>
      <ellipse cx="12" cy="134" rx="4" ry="9" fill="#93603f"/>
      <ellipse cx="92" cy="134" rx="4" ry="9" fill="#93603f"/>
      <path d="M12 116c0-26 18-40 40-40s40 14 40 40c0 26-8 46-18 54-6 4-14 6-22 6s-16-2-22-6c-10-8-18-28-18-54z" fill="url(#hair)"/>
      <ellipse cx="52" cy="118" rx="60" ry="10" fill="#000" fill-opacity="0.25"/>
      <ellipse cx="52" cy="106" rx="86" ry="14" fill="url(#brim)"/>
      <path d="M12 106C7 70 20 44 40 40l12 12 12-12c20 4 33 30 28 66z" fill="url(#crown)"/>
      <path d="M11 92h82l1 14H10z" fill="#2a211b"/>
    </g>
    <!-- shadows the bindle casts on him -->
    <ellipse cx="152" cy="172" rx="66" ry="62" fill="url(#cast)"/>
    <!-- the stick: far end on his shoulder, near end coming at the camera -->
    <path d="M160.2 123.2L114.5 28.3L93.5 39.7L148.6 129.6z" fill="url(#stick)"/>
    <!-- the bundle: a knotted cloth, lumpy with what's inside, hanging under the tie -->
    <g transform="translate(125.8 94.0)">
      <path d="M-18 0C-44 2-70 22-68 54-66 80-50 96-30 100c16 4 26 0 36 4 16 4 40-2 52-14 14-14 12-46-2-66C46 8 30 2 18 0z" fill="url(#bag)"/>
      <path d="M-18 0C-44 2-70 22-68 54-66 80-50 96-30 100c16 4 26 0 36 4 16 4 40-2 52-14 14-14 12-46-2-66C46 8 30 2 18 0z" fill="url(#fold)"/>
      <g fill="url(#dot)">
        <ellipse cx="-38" cy="34" rx="6" ry="5.5"/><ellipse cx="-8" cy="22" rx="6" ry="5.5"/>
        <ellipse cx="26" cy="30" rx="6" ry="5.5"/><ellipse cx="50" cy="52" rx="5" ry="6"/>
        <ellipse cx="-52" cy="66" rx="5" ry="6"/><ellipse cx="-20" cy="60" rx="6" ry="5.5"/>
        <ellipse cx="14" cy="66" rx="6" ry="5.5"/><ellipse cx="-2" cy="94" rx="6" ry="4.5" opacity="0.8"/>
        <ellipse cx="34" cy="90" rx="5.5" ry="4.5" opacity="0.8"/>
      </g>
      <g fill="none" stroke="#7d2424" stroke-width="3" stroke-linecap="round" opacity="0.7">
        <path d="M-10 4c-12 16-24 32-30 50"/><path d="M0 6c0 18-4 36-12 52"/>
        <path d="M10 4c14 14 26 28 32 46"/><path d="M-48 46c8 4 14 10 16 18"/><path d="M40 70c-6 6-14 10-22 10"/>
      </g>
      <g fill="none" stroke="#f08b7c" stroke-width="2" stroke-linecap="round" opacity="0.5">
        <path d="M-6 6c-10 14-20 28-24 42"/><path d="M14 6c10 10 18 20 22 32"/>
      </g>
    </g>
    <!-- the bag's neck, gathered up and tied round the stick -->
    <path d="M105.8 98.0c8-6 12-14 13-24h14c1 10 5 18 13 24c-6 4-34 4-40 0z" fill="url(#knot)"/>
    <path d="M122.8 78.0c-1 8-4 14-8 18M129.8 78.0c1 8 4 14 8 18" stroke="#9a3232" stroke-width="1.5" fill="none" opacity="0.7"/>
    <path d="M121.8 72.0c-12-2-22-10-24-20 10-1 20 6 26 16z" fill="url(#knot)"/>
    <path d="M130.8 71.0c6-10 16-16 28-14-4 10-16 16-28 14z" fill="url(#knot)"/>
    <g transform="rotate(-29 125.8 74.0)">
      <rect x="113.2" y="69.0" width="25.3" height="10" rx="5" fill="url(#knot)"/>
      <path d="M115.2 75.0h21.3" stroke="#8f2e2e" stroke-width="1.5" opacity="0.6"/>
    </g>
    <!-- the cut end of the stick, facing the camera -->
    <ellipse cx="104" cy="34" rx="12" ry="11" transform="rotate(-29 104 34)" fill="url(#grain)" stroke="#6e4724" stroke-width="1.5"/>
    <ellipse cx="103.5" cy="33.5" rx="5.5" ry="5" transform="rotate(-29 104 34)" fill="none" stroke="#a87443" stroke-width="1.2"/>
    <circle cx="103" cy="33" r="1.6" fill="#8a5a30"/>
  </g>
</svg>
