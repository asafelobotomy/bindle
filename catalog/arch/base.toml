[category]
id = "base"
name = "System"
description = "Pacman, mirrors, AUR access, microcode and firmware."
order = 10

[[module]]
id = "pacman-qol"
group = "Package manager"
name = "Pacman quality-of-life"
description = "Colour, parallel downloads, verbose package lists and a weekly package-cache cleanup."
default = true
pacman = { Color = "", ParallelDownloads = "10", VerbosePkgLists = "" }
packages = ["pacman-contrib"]
enable = ["paccache.timer"]

[[module]]
id = "mirrors"
group = "Package manager"
name = "Fast mirrors (reflector)"
description = "Rank recent HTTPS mirrors weekly with reflector."
default = true
# Derivatives have their own mirror lists and tools (pacman-mirrors, rate-mirrors…).
when = ["distro:arch"]
packages = ["reflector"]
enable = ["reflector.timer"]
[[module.files]]
path = "/etc/xdg/reflector/reflector.conf"
content = '''
# Managed by Bindle
--save /etc/pacman.d/mirrorlist
--protocol https
--age 12
--latest 20
--sort score
--number 10
'''

[[module]]
id = "multilib"
group = "Package manager"
name = "32-bit packages (multilib)"
description = "32-bit repository required by Steam, Wine and lib32 graphics drivers."
profiles = ["gaming"]
repos = ["multilib"]

[[module]]
id = "build-tools"
group = "Building & AUR"
name = "Build tools"
description = "base-devel and git, needed for the AUR and most development."
default = true
packages = ["base-devel", "git"]

[[module]]
id = "aur-helper"
group = "Building & AUR"
name = "AUR helper (paru)"
description = "paru, to install community packages from the AUR."
risk = "moderate"
profiles = ["desktop", "gaming", "developer"]
requires = ["build-tools"]
builtin = "aur-helper"

[[module]]
id = "microcode"
group = "Firmware & upkeep"
name = "CPU microcode"
description = "intel-ucode or amd-ucode for your CPU."
default = true
when = ["!virt"]
builtin = "microcode"

[[module]]
id = "firmware-updates"
group = "Firmware & upkeep"
name = "Firmware updates (fwupd)"
description = "Update device firmware from LVFS."
profiles = ["desktop", "gaming", "developer"]
when = ["!virt"]
packages = ["fwupd"]

[[module]]
id = "fstrim"
group = "Firmware & upkeep"
name = "Weekly SSD TRIM"
description = "Enable fstrim.timer to keep SSD performance steady."
default = true
when = ["ssd"]
enable = ["fstrim.timer"]

[[module]]
id = "man-pages"
group = "Documentation"
name = "Manual pages"
description = "man and the Linux man pages, plus pkgfile to find which package provides a command."
profiles = ["desktop", "gaming", "developer"]
packages = ["man-db", "man-pages", "pkgfile"]
enable = ["man-db.timer", "pkgfile-update.timer"]
