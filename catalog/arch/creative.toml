# ArtCraft (github.com/storytold): Rust rebuilds of Adobe/Office apps. All are
# alpha and release almost daily: bump tag/asset/sha256 from each release's
# SHA256SUMS.txt. Packages are named ai.storyteller.<app> and conflict with
# the AUR's <app>, <app>-bin and <app>-git builds.

[[module]]
id = "photocraft"
group = "ArtCraft suite"
name = "PhotoCraft (alpha)"
description = "ArtCraft's open-source take on Photoshop. Early alpha: expect missing features and bugs, especially on Wayland."
risk = "moderate"
package_conflicts = ["photocraft", "photocraft-bin", "photocraft-git"]
[[module.release]]
repo = "storytold/photocraft"
tag = "v0.23.1"
asset = "photocraft-0.23.1-linux-x86_64.pkg.tar.zst"
sha256 = "6f55b05a7880a6db38374ac7985730304bcc9b499dae0f18f9d2dbd6bbb8d201"
name = "ai.storyteller.photocraft"

