[[module]]
id = "user-dirs"
group = "Desktop basics"
name = "XDG user folders"
description = "Creates Documents, Downloads, Music, Pictures and Videos in your home folder."
profiles = ["desktop", "gaming", "developer"]
packages = ["xdg-user-dirs"]
user_commands = [{ argv = ["xdg-user-dirs-update"], unless = [{ path = "~/.config/user-dirs.dirs" }] }]

# For desktops that ship no apps of their own (desktops.toml `everyday`):
# Qt's set on uQ and Hyprland, GTK's on the other window managers.
[[module]]
id = "everyday-apps"
group = "Desktop basics"
name = "Everyday apps"
description = "File manager, archive manager, image and PDF viewers, calculator and a disk tool, matching your desktop."
when = ["bare-desktop"]
profiles = ["desktop", "gaming", "developer"]
builtin = "everyday"

# Window managers name no file manager, so whichever app last claimed
# folders opens them (kitty, an editor). Skipped once you've chosen one.
[[module]]
id = "default-file-manager"
group = "Desktop basics"
name = "Folders and PDFs open in the right app"
description = "Opening a folder shows it in Dolphin (or Files), and a PDF opens in the document viewer, not in whichever app claimed them last (a terminal, the browser)."
default = true
when = ["bare-desktop"]
user_commands = [
  { argv = ["sh", "-c", '[ ! -f /usr/share/applications/org.kde.dolphin.desktop ] || xdg-mime default org.kde.dolphin.desktop inode/directory'], when = ["everyday:qt"], unless = [{ path = "~/.config/mimeapps.list", contains = "inode/directory=" }] },
  { argv = ["sh", "-c", '[ ! -f /usr/share/applications/org.gnome.Nautilus.desktop ] || xdg-mime default org.gnome.Nautilus.desktop inode/directory'], when = ["everyday:gtk"], unless = [{ path = "~/.config/mimeapps.list", contains = "inode/directory=" }] },
  { argv = ["sh", "-c", '[ ! -f /usr/share/applications/okularApplication_pdf.desktop ] || xdg-mime default okularApplication_pdf.desktop application/pdf'], when = ["everyday:qt"], unless = [{ path = "~/.config/mimeapps.list", contains = "application/pdf=" }] },
  { argv = ["sh", "-c", '[ ! -f /usr/share/applications/org.gnome.Papers.desktop ] || xdg-mime default org.gnome.Papers.desktop application/pdf'], when = ["everyday:gtk"], unless = [{ path = "~/.config/mimeapps.list", contains = "application/pdf=" }] },
]

# Baloo reads every file's text outside Plasma too, where no settings page
# controls it. Plasma keeps full indexing.
[[module]]
id = "file-search-names"
group = "Desktop basics"
name = "File search by name only"
description = "Dolphin's search finds files by name without reading every file's contents in the background (less disk and battery)."
default = true
when = ["everyday:qt"]
user_commands = [{ argv = ["sh", "-c", 'command -v balooctl6 >/dev/null || exit 0; balooctl6 config set contentIndexing no'], unless = [{ path = "~/.config/baloofilerc", contains = "only basic indexing=true" }] }]
notes = ["To search inside files again: `balooctl6 config set contentIndexing yes`."]

# Dolphin writes its preview-plugin list to dolphinrc the first time previews
# are configured, and only names the thumbnailers installed at that moment.
# A thumbnailer installed later (video: ffmpegthumbs) is then never asked.
# Dropping the list makes Dolphin use every installed thumbnailer again.
[[module]]
id = "dolphin-video-thumbnails"
group = "Desktop basics"
name = "Video thumbnails in Dolphin"
description = "Dolphin shows thumbnails for videos, RAW photos, PDFs and Blender files, as it does on Plasma."
default = true
when = ["everyday:qt"]
packages = ["ffmpegthumbs", "kdegraphics-thumbnailers"]
user_commands = [{ argv = ["sh", "-c", 'command -v kwriteconfig6 >/dev/null || exit 0; kwriteconfig6 --file dolphinrc --group PreviewSettings --key Plugins --delete'], unless = [{ path = "~/.config/dolphinrc", contains = "ffmpegthumbs" }] }]
notes = ["Close Dolphin before applying: it rewrites its settings when it quits.", "Preview sizes for remote and network folders stay as set in Dolphin's Configure > General > Previews."]

