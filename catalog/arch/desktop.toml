[category]
id = "desktop"
name = "Desktop & apps"
description = "Desktop essentials, fonts, codecs, Flatpak and everyday apps."
order = 40

[[module]]
id = "desktop-essentials"
group = "Desktop basics"
name = "Desktop essentials"
description = "The apps, portals, polkit agent and applets archinstall leaves out of your desktop."
default = true
when = ["desktop"]
builtin = "desktop"

[[module]]
id = "uq"
group = "uQ desktop"
name = "uQ desktop"
description = "uQ, a themeable Hyprland desktop: shell, theming daemon and base config. By asafelobotomy."
notes = [
  "Built from the AUR (uq, uq-hyprland-pin, the Bibata cursors), then `uqctl setup --apps` writes ~/.config/hypr/hyprland.lua and themes GTK, Qt and terminal apps to match.",
  "An existing hyprland.lua (or GTK, qt6ct or terminal config) is kept: add the lines uqctl prints to it.",
  "uQ's login screen (greetd) replaces the current one from the next boot; `run0 uqctl greeter disable` switches back.",
]
requires = ["aur-helper"]
# greetd runs uQ's login screen; uq ships its config, so greetd's own is never edited.
packages = ["greetd"]
# Bibata left the Arch repos for the AUR; -bin skips building it from source.
aur = ["uq", "uq-hyprland-pin", "bibata-cursor-theme-bin"]
# After the AUR install: switch display-manager.service to greetd with uQ's
# greeter, recording the one it replaces for `uqctl greeter disable`. Skipped
# once greetd is the display manager.
root_commands = [
  { argv = ["uqctl", "greeter", "enable"], unless = [{ path = "/etc/systemd/system/display-manager.service", contains = "greetd" }] },
]
# uqctl setup: 0 = uQ's hyprland.lua is in place, 1 = error, 2 = ran as root, 3 = the user's own file was kept.
# --apps also points GTK, qt6ct, Kvantum and the terminals at uQ's theme: without it uQ's own
# Settings and every Qt app stay in the default light style under a dark uQ theme. It only
# creates files that don't exist (one it keeps is reported, never an error), so it is re-run
# until qt6ct.conf loads uQ's colours; a qt6ct.conf of the user's own keeps it re-running harmlessly.
[[module.user_commands]]
argv = ["uqctl", "setup", "--apps"]
unless = [
  { path = "~/.config/hypr/hyprland.lua", contains = "require(\"./uq/generated.lua\")" },
  { path = "~/.config/qt6ct/qt6ct.conf", contains = "/uq/theme/qt6ct/colors/uq.conf" },
]
manual = { 3 = "your own ~/.config/hypr/hyprland.lua was kept. Add the lines `uqctl setup` printed above to the top of it, then log out and back in to start uQ." }

[[module]]
id = "bindaru"
group = "uQ desktop"
name = "bindaru (software store)"
description = "Find, install and remove software from the Arch repositories and the AUR, with every AUR recipe shown for you to read before anything is built. Add repositories, scan installs with oysterAV; a window, a command and a page in uQ Settings. By asafelobotomy."
notes = ["Open bindaru from your app menu, or run `bindaru search <name>`. System upgrades stay in bindleUP."]
requires = ["aur-helper"]
aur = ["bindaru"]

[[module]]
id = "noti-fi"
group = "uQ desktop"
name = "noti-fi (notifications)"
description = "Notification daemon (notifd) with grouped popups, rules, history and Do Not Disturb; uQ's bar and OSD use it. By asafelobotomy."
notes = ["Replaces mako, dunst and swaync. `notify restore` hands notifications back."]
# Its daemon (Quickshell) is Wayland-only: built for Plasma and Hyprland, a plain user
# service elsewhere. Not where the shell itself owns notifications and can't hand
# them over (GNOME Shell, COSMIC, Budgie, DankMaterialShell).
when = ["display:wayland", "!desktop:gnome", "!desktop:cosmic", "!desktop:budgie", "!desktop:niri-dms"]
requires = ["aur-helper"]
aur = ["noti-fi"]
package_conflicts = ["mako", "dunst", "swaync"]
# Outside Plasma takeover installs notifd as a plain user service; --now also
# switches the running session, and refuses while another daemon holds the name.
[[module.user_commands]]
# Without a session (the installer setting the new system up before its first boot) there is
# nothing running to take over from: plain `takeover` writes and enables the units, and notifd
# starts at the first login. --now failed there, and its manual step was all that was left.
argv = ["sh", "-c", 'if [ -S "${XDG_RUNTIME_DIR:-/nonexistent}/bus" ]; then exec notify takeover --now; else exec notify takeover; fi']
unless = [{ path = "~/.local/state/notifd/takeover.json" }]
manual = { 1 = "notifd could not take over notifications yet. Log in to your desktop and run `notify takeover --now`." }

[[module]]
id = "uqview"
group = "uQ desktop"
name = "uQview (picture viewer)"
description = "Opens pictures fast in uQ's theme, marks up screenshots (arrows, boxes, text, numbers, pixelate, crop) and sets a picture as the wallpaper. By asafelobotomy."
notes = ["uQview opens pictures unless you already chose an app for them; its page in uQ Settings switches it."]
requires = ["aur-helper"]
aur = ["uqview"]
# The app for pictures, unless one was chosen already (a PNG default in mimeapps.list).
user_commands = [{ argv = ["uqview", "default", "set"], unless = [{ path = "~/.config/mimeapps.list", contains = "image/png=" }] }]

[[module]]
id = "crumbs"
group = "Utilities"
name = "crumBS (uninstaller and cleaner)"
description = "Lists every installed app, uninstalls them with their leftovers, and cleans caches and old files, all to the trash with undo. By asafelobotomy."
notes = ["Run `crumbs scan` to see what can be cleaned. uQ's own packages need a second confirmation to remove."]
requires = ["aur-helper"]
# -bin: a static build, no Rust toolchain needed.
aur = ["crum-bs-bin"]

[[module]]
id = "uq-dev"
group = "uQ desktop"
name = "uQ developer setup"
description = "Clones uQ and its apps into ~/Projects and installs what building them needs, so you can work on them while you use the installed ones. By asafelobotomy."
notes = [
  "`uq-dev session` opens a nested uQ running your ~/Projects/uq checkout; `uq-dev run <repo>` runs an app from its checkout beside the installed one.",
  "`uq-dev promote <repo>` installs a build of a checkout and `uq-dev rollback <package>` undoes it. See docs/developing.md in ~/Projects/uq.",
]
profiles = ["developer"]
when = ["desktop:uq"]
# uq ships uq-dev; rustup, build-tools and python bring cargo, makepkg, git and uv.
requires = ["uq", "rustup", "build-tools", "python"]
# The rest of what the checkouts' builds and tests use (Qt for uq-settings and the Bindle GUI).
packages = ["github-cli", "jq", "lua", "shellcheck", "qt6-base", "qt6-declarative", "kirigami"]
# Over HTTPS, so no key is needed yet; a repo already there is left alone. Exit 3 = some
# failed (offline, or a private repo), listed on stderr.
[[module.user_commands]]
argv = ["sh", "-ec", """
mkdir -p "$HOME/Projects"
failed=""
for r in uq bindle bindaru noti-fi scdr crumbs appofholding scale_tail romforge hauler emobie oysterAV XZram reelo uqview kyko AV-Morning-Star; do
  [ -d "$HOME/Projects/$r/.git" ] && continue
  git clone -q "https://github.com/asafelobotomy/$r.git" "$HOME/Projects/$r" || failed="$failed $r"
done
if [ -n "$failed" ]; then echo "could not clone:$failed" >&2; exit 3; fi"""]
unless = [
  { path = "~/Projects/uq/.git/HEAD" }, { path = "~/Projects/bindle/.git/HEAD" },
  { path = "~/Projects/bindaru/.git/HEAD" },
  { path = "~/Projects/noti-fi/.git/HEAD" }, { path = "~/Projects/scdr/.git/HEAD" },
  { path = "~/Projects/crumbs/.git/HEAD" }, { path = "~/Projects/appofholding/.git/HEAD" },
  { path = "~/Projects/scale_tail/.git/HEAD" }, { path = "~/Projects/romforge/.git/HEAD" },
  { path = "~/Projects/hauler/.git/HEAD" }, { path = "~/Projects/emobie/.git/HEAD" },
  { path = "~/Projects/oysterAV/.git/HEAD" }, { path = "~/Projects/XZram/.git/HEAD" },
  { path = "~/Projects/reelo/.git/HEAD" }, { path = "~/Projects/uqview/.git/HEAD" },
  { path = "~/Projects/kyko/.git/HEAD" }, { path = "~/Projects/AV-Morning-Star/.git/HEAD" },
]
manual = { 3 = "some uQ repos could not be cloned (see above). Clone them into ~/Projects later; uq-dev uses whichever are there." }

