# uQ's own player replaces these on uQ (the `reelo` module below).
[[module]]
id = "media-players"
group = "Media"
name = "Media players"
description = "VLC and mpv for video and audio."
when = ["desktop", "!desktop:uq"]
profiles = ["desktop", "gaming", "developer"]
packages = ["vlc", "mpv"]

# uQ pre-selects it (desktops.toml `apps`). It becomes the default player for video and music
# unless another player (other than VLC or mpv, which it replaces) was chosen.
[[module]]
id = "reelo"
group = "Media"
name = "reelo (media player)"
description = "Plays video, music and streams with mpv's engine, follows the uQ theme, shows in uQ's media controls, and lists your newest downloads. By asafelobotomy."
when = ["desktop"]
requires = ["aur-helper"]
aur = ["reelo"]
[[module.user_commands]]
argv = ["sh", "-c", 'case "$(xdg-mime query default video/mp4 2>/dev/null)" in ""|vlc.desktop|org.videolan.VLC.desktop|mpv.desktop|io.mpv.Mpv.desktop) exec reelo default set ;; esac']
unless = [{ path = "~/.config/mimeapps.list", contains = "video/mp4=io.github.asafelobotomy.reelo.desktop" }]

[[module]]
id = "spotify"
group = "Media"
name = "Spotify"
description = "spotify-launcher, which installs Spotify's official build and keeps it updated."
packages = ["spotify-launcher"]

[[module]]
id = "libreoffice"
group = "Office & notes"
name = "LibreOffice"
description = "Office suite: documents, spreadsheets and presentations."
packages = ["libreoffice-fresh"]

[[module]]
id = "obsidian"
group = "Office & notes"
name = "Obsidian"
description = "Markdown notes and knowledge base."
packages = ["obsidian"]

# uQ pre-selects it (desktops.toml `apps`).
[[module]]
id = "marknote"
group = "Office & notes"
name = "Marknote"
description = "Simple notes in Markdown, organised in notebooks. KDE's notes app."
packages = ["marknote"]

[[module]]
id = "xournalpp"
group = "Office & notes"
name = "Xournal++"
description = "Handwritten notes and PDF annotation, for pen tablets and touch screens."
packages = ["xournalpp"]

# KWrite (from the kate package): a plain notepad that follows uQ's theme
# through qt6ct. uQ and Hyprland pre-select it (desktops.toml `apps`).
[[module]]
id = "text-editor"
group = "Desktop basics"
name = "Text editor (KWrite)"
description = "A simple notepad for text files and quick edits, with tabs and syntax colours. Follows uQ's theme."
when = ["desktop"]
packages = ["kate"]
# Text files open in it unless an app was chosen already: without a default, Okular's
# plain-text viewer comes first in the list and opens them read-only.
user_commands = [{ argv = ["sh", "-c", '[ ! -f /usr/share/applications/org.kde.kwrite.desktop ] || xdg-mime default org.kde.kwrite.desktop text/plain'], unless = [{ path = "~/.config/mimeapps.list", contains = "text/plain=" }] }]

[[module]]
id = "yakuake"
group = "Utilities"
name = "Yakuake"
description = "Drop-down terminal for Plasma (F12 to toggle)."
when = ["desktop:plasma"]
packages = ["yakuake"]

[[module]]
id = "emobie"
group = "Utilities"
name = "emobie (emoji palette)"
description = "Compact emoji palette with a global hotkey, favourites and text macros. By asafelobotomy."
requires = ["aur-helper"]
aur = ["emobie"]
# emobie's Grant, run from an AppImage or a build, copies its polkit action into
# /usr/share/polkit-1/actions, where no package owns it: the package ships the same
# file, so pacman refuses it as a conflict. That unowned copy goes before the AUR step.
root_commands = [{ argv = ["sh", "-c", 'f=/usr/share/polkit-1/actions/io.github.asafelobotomy.emobie.inputd.policy; if [ -e "$f" ] && ! pacman -Qoq "$f" >/dev/null 2>&1; then rm -f "$f"; fi'], unless = [{ path = "/usr/bin/emobie" }], before_aur = true }]
# Bindle installed it as an AppImage before it came from the AUR: that copy goes once the
# package is in (only when Bindle's own desktop entry for it is still there).
[[module.user_commands]]
argv = ["sh", "-c", "e=\"$HOME/.local/share/applications/bindle-$0.desktop\"; if grep -qs '^X-Bindle-Asset=' \"$e\"; then rm -f \"$HOME/.local/bin/$0\" \"$e\"; fi", "emobie"]
unless = [{ path = "/usr/bin/emobie" }]

[[module]]
id = "appofholding"
group = "Utilities"
name = "appOFholding (AppImage manager)"
description = "Adds AppImages to your application menu, keeps them up to date from GitHub and GitLab, and sandboxes them. By asafelobotomy."
notes = ["Once it is in use, crumBS leaves the AppImages in ~/Applications to it."]
requires = ["aur-helper"]
# The same package name as the release package Bindle installed before, so that one updates in place.
aur = ["appofholding"]
