[category]
id = "desktop"
name = "Desktop & apps"
description = "Fonts, codecs, Flatpak and everyday applications."
order = 40

[[module]]
id = "fonts"
name = "Fonts"
description = "Noto (incl. emoji and CJK), DejaVu and Liberation for web/document compatibility."
profiles = ["desktop", "gaming", "developer"]
packages = ["noto-fonts", "noto-fonts-emoji", "noto-fonts-cjk", "ttf-dejavu", "ttf-liberation"]

[[module]]
id = "codecs"
name = "Multimedia codecs"
description = "FFmpeg and the GStreamer plugin sets."
profiles = ["desktop", "gaming", "developer"]
packages = ["ffmpeg", "gst-plugins-good", "gst-plugins-bad", "gst-plugins-ugly", "gst-libav"]

[[module]]
id = "flatpak"
name = "Flatpak + Flathub"
description = "Sandboxed apps; Arch's flatpak package ships the Flathub remote."
profiles = ["desktop", "gaming"]
packages = ["flatpak"]

[[module]]
id = "archives"
name = "Archive tools"
description = "zip, unzip, 7-Zip and unrar."
profiles = ["desktop", "gaming", "developer"]
packages = ["zip", "unzip", "7zip", "unrar"]

[[module]]
id = "user-dirs"
name = "XDG user folders"
description = "Create Documents, Downloads, Music, Pictures and Videos in your home folder."
profiles = ["desktop", "gaming", "developer"]
packages = ["xdg-user-dirs"]
user_commands = [{ argv = ["xdg-user-dirs-update"], unless = [{ path = "~/.config/user-dirs.dirs" }] }]

[[module]]
id = "firefox"
name = "Firefox"
description = "Web browser."
profiles = ["desktop", "gaming", "developer"]
packages = ["firefox"]

[[module]]
id = "desktop-essentials"
name = "Desktop essentials"
description = "Fill the gaps archinstall's desktop profile leaves: core apps, portals, polkit agent, bar/lock tools and applets for each detected desktop."
default = true
when = ["desktop"]
builtin = "desktop"

[[module]]
id = "emobie"
name = "emobie (emoji palette)"
description = "Compact emoji palette with a global hotkey, favourites and text macros. By asafelobotomy; AppImage from its GitHub release, installed to ~/.local/bin."
packages = ["fuse2"]
[[module.release]]
repo = "asafelobotomy/emobie"
tag = "v0.8.2"
asset = "emobie_0.8.2_amd64.AppImage"
sha256 = "3d36a1040d005545204bfe8475cf953292ced9389317950dac1e1892deab66c8"
name = "emobie"

[[module]]
id = "av-morning-star"
name = "AV Morning Star (video downloader)"
description = "Download video and audio from YouTube, Odysee and 1000+ sites (a yt-dlp front end). By asafelobotomy; AppImage from its GitHub release, installed to ~/.local/bin."
packages = ["fuse2", "yt-dlp"]
[[module.release]]
repo = "asafelobotomy/AV-Morning-Star"
tag = "v0.4.2"
asset = "AV-Morning-Star-0.4.2-x86_64.AppImage"
sha256 = "e12b3c7d125936b6ed9776b2da1513f9a1e9c10e466e6f8a9bde0a581e8d4a47"
name = "av-morning-star"

[[module]]
id = "qbit-plugin-dl"
name = "qbit Plugin Manager"
description = "Pick and install qBittorrent search plugins from allowlisted catalogs. By asafelobotomy; AppImage from its GitHub release, installed to ~/.local/bin."
packages = ["fuse2"]
requires = ["qbittorrent"]
[[module.release]]
repo = "asafelobotomy/qbit-plugin-dl"
tag = "v0.2.1"
asset = "qbit-plugin-dl-x86_64.AppImage"
sha256 = "43bd1684d54697dcd8c1fffdfd9192b5908cfc75fb9659e2d25cc62fb75af104"
name = "qbit-plugin-dl"

[[module]]
id = "hauler"
name = "hauler (download manager)"
description = "Fast, resumable downloads over parallel connections; CLI, daemon and Kirigami app. By asafelobotomy; installed from its GitHub release."
[[module.release]]
repo = "asafelobotomy/hauler"
tag = "v0.1.2"
asset = "hauler-0.1.2-1-x86_64.pkg.tar.zst"
sha256 = "c464fcf42aceaf2a61c65cedbe58358829f9366df7eddeeb59466d081abe5a1b"
name = "hauler"

[[module]]
id = "libreoffice"
name = "LibreOffice"
description = "Office suite: documents, spreadsheets, presentations (the 'fresh' branch)."
packages = ["libreoffice-fresh"]

[[module]]
id = "media-players"
name = "Media players"
description = "VLC and mpv for video and audio."
profiles = ["desktop", "gaming", "developer"]
packages = ["vlc", "mpv"]

[[module]]
id = "keepassxc"
name = "KeePassXC"
description = "Offline password manager with browser integration."
packages = ["keepassxc"]

[[module]]
id = "bitwarden"
name = "Bitwarden"
description = "Desktop client for the Bitwarden password manager."
packages = ["bitwarden"]

[[module]]
id = "thunderbird"
name = "Thunderbird"
description = "Mail, calendar and contacts."
packages = ["thunderbird"]

[[module]]
id = "signal"
name = "Signal"
description = "Signal Desktop messenger."
packages = ["signal-desktop"]

[[module]]
id = "telegram"
name = "Telegram"
description = "Telegram Desktop messenger."
packages = ["telegram-desktop"]

[[module]]
id = "element"
name = "Element"
description = "Matrix chat client."
packages = ["element-desktop"]

[[module]]
id = "backup-gtk"
name = "Backups (Pika Backup)"
description = "Deduplicated, encrypted backups of your home folder (BorgBackup)."
when = ["toolkit:gtk"]
packages = ["pika-backup"]

[[module]]
id = "backup-deja-dup"
name = "Backups (Déjà Dup)"
description = "Simple scheduled backups to a drive or the cloud."
packages = ["deja-dup"]

[[module]]
id = "qbittorrent"
name = "qBittorrent"
description = "BitTorrent client."
packages = ["qbittorrent"]

[[module]]
id = "flatpak-discover"
name = "Flatpak in Discover"
description = "Browse and update Flathub apps in Plasma's Discover."
profiles = ["desktop", "gaming"]
when = ["desktop:plasma"]
requires = ["flatpak"]
packages = ["discover", "flatpak-kcm"]

[[module]]
id = "flatpak-gnome-software"
name = "Flatpak in GNOME Software"
description = "Browse and update Flathub apps in GNOME Software."
profiles = ["desktop", "gaming"]
when = ["desktop:gnome"]
requires = ["flatpak"]
packages = ["gnome-software"]
