[category]
id = "desktop"
name = "Desktop & apps"
description = "Desktop essentials, fonts, codecs, Flatpak and everyday apps."
order = 40

[[module]]
id = "desktop-essentials"
name = "Desktop essentials"
description = "The apps, portals, polkit agent and applets archinstall leaves out of your desktop."
default = true
when = ["desktop"]
builtin = "desktop"

[[module]]
id = "uq"
name = "uQ desktop"
description = "uQ, a themeable Hyprland desktop: shell, theming daemon and base config. By asafelobotomy."
notes = [
  "Built from the AUR (uq, uq-hyprland-pin, the Bibata cursors), then `uqctl setup` writes ~/.config/hypr/hyprland.lua for you.",
  "An existing hyprland.lua is kept: add the lines uqctl prints to it to start uQ.",
]
requires = ["aur-helper"]
# Bibata left the Arch repos for the AUR; -bin skips building it from source.
aur = ["uq", "uq-hyprland-pin", "bibata-cursor-theme-bin"]
# uqctl setup: 0 = uQ's hyprland.lua is in place, 1 = error, 2 = ran as root, 3 = the user's own file was kept.
[[module.user_commands]]
argv = ["uqctl", "setup"]
unless = [{ path = "~/.config/hypr/hyprland.lua", contains = "require(\"./uq/generated.lua\")" }]
manual = { 3 = "your own ~/.config/hypr/hyprland.lua was kept. Add the lines `uqctl setup` printed above to the top of it, then log out and back in to start uQ." }

[[module]]
id = "noti-fi"
name = "noti-fi (notifications)"
description = "Notification daemon (notifd) with grouped popups, rules, history and Do Not Disturb; uQ's bar and OSD use it. By asafelobotomy."
notes = ["Replaces mako, dunst and swaync. `notify restore` hands notifications back."]
requires = ["aur-helper"]
aur = ["noti-fi"]
package_conflicts = ["mako", "dunst", "swaync"]
# Outside Plasma takeover installs notifd as a plain user service; --now also
# switches the running session, and refuses while another daemon holds the name.
[[module.user_commands]]
argv = ["notify", "takeover", "--now"]
unless = [{ path = "~/.local/state/notifd/takeover.json" }]
manual = { 1 = "notifd could not take over notifications yet. Log in to your desktop and run `notify takeover --now`." }

[[module]]
id = "crumbs"
name = "crumBS (uninstaller and cleaner)"
description = "Lists every installed app, uninstalls them with their leftovers, and cleans caches and old files, all to the trash with undo. By asafelobotomy."
notes = ["Run `crumbs scan` to see what can be cleaned. uQ's own packages need a second confirmation to remove."]
requires = ["aur-helper"]
# -bin: a static build, no Rust toolchain needed.
aur = ["crum-bs-bin"]

[[module]]
id = "uq-dev"
name = "uQ developer setup"
description = "Clones uQ and its apps into ~/Projects and installs what building them needs, so you can work on them while you use the installed ones. By asafelobotomy."
notes = [
  "`uq-dev session` opens a nested uQ running your ~/Projects/uq checkout; `uq-dev run <repo>` runs an app from its checkout beside the installed one.",
  "`uq-dev promote <repo>` installs a build of a checkout and `uq-dev rollback <package>` undoes it. See docs/developing.md in ~/Projects/uq.",
]
profiles = ["developer"]
when = ["desktop:uq"]
# uq ships uq-dev; rustup, build-tools and python bring cargo, makepkg, git and uv.
requires = ["uq", "rustup", "build-tools", "python"]
# The rest of what the checkouts' builds and tests use (Qt for uq-settings and the Bindle GUI).
packages = ["github-cli", "jq", "lua", "shellcheck", "qt6-base", "qt6-declarative", "kirigami"]
# Over HTTPS, so no key is needed yet; a repo already there is left alone. Exit 3 = some
# failed (offline, or a private repo), listed on stderr.
[[module.user_commands]]
argv = ["sh", "-ec", """
mkdir -p "$HOME/Projects"
failed=""
for r in uq bindle noti-fi scdr crumbs appofholding scale_tail romforge hauler emobie oysterAV XZram; do
  [ -d "$HOME/Projects/$r/.git" ] && continue
  git clone -q "https://github.com/asafelobotomy/$r.git" "$HOME/Projects/$r" || failed="$failed $r"
done
if [ -n "$failed" ]; then echo "could not clone:$failed" >&2; exit 3; fi"""]
unless = [
  { path = "~/Projects/uq/.git/HEAD" }, { path = "~/Projects/bindle/.git/HEAD" },
  { path = "~/Projects/noti-fi/.git/HEAD" }, { path = "~/Projects/scdr/.git/HEAD" },
  { path = "~/Projects/crumbs/.git/HEAD" }, { path = "~/Projects/appofholding/.git/HEAD" },
  { path = "~/Projects/scale_tail/.git/HEAD" }, { path = "~/Projects/romforge/.git/HEAD" },
  { path = "~/Projects/hauler/.git/HEAD" }, { path = "~/Projects/emobie/.git/HEAD" },
  { path = "~/Projects/oysterAV/.git/HEAD" }, { path = "~/Projects/XZram/.git/HEAD" },
]
manual = { 3 = "some uQ repos could not be cloned (see above). Clone them into ~/Projects later; uq-dev uses whichever are there." }

