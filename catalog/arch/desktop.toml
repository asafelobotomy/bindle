requires = ["flatpak"]
packages = ["bazaar", "xdg-utils"]
user_commands = [
  { argv = ["xdg-mime", "default", "io.github.kolunmi.Bazaar.desktop", "x-scheme-handler/appstream", "x-scheme-handler/flatpak", "x-scheme-handler/flatpak+https", "application/vnd.flatpak", "application/vnd.flatpak.ref"], unless = [{ path = "~/.config/mimeapps.list", contains = "application/vnd.flatpak.ref=io.github.kolunmi.Bazaar.desktop" }] },
]

