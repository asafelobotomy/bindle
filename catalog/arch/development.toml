[category]
id = "development"
name = "Development"
description = "Languages, editors, terminals, shells, containers and VMs."
order = 50

[[module]]
id = "rustup"
name = "Rust (rustup)"
description = "Rust via rustup, with the stable toolchain."
profiles = ["developer"]
packages = ["rustup"]
package_conflicts = ["rust", "cargo", "rustfmt"]
# Before the AUR: Rust packages (scdr, noti-fi, crum-bs) build with this toolchain.
user_commands = [{ argv = ["rustup", "default", "stable"], before_aur = true, unless = [{ path = "~/.rustup/settings.toml", contains = 'default_toolchain = "stable' }] }]

[[module]]
id = "python"
name = "Python tooling"
description = "pip, pipx, uv and ruff."
profiles = ["developer"]
packages = ["python", "python-pip", "python-pipx", "uv", "ruff"]

[[module]]
id = "nodejs"
name = "Node.js"
description = "Node.js LTS runtime with npm."
profiles = ["developer"]
# Newest LTS in the repos (Node 24). Review each October when a new LTS lands.
packages = ["nodejs-lts-krypton", "npm"]
package_conflicts = ["nodejs", "nodejs-lts-jod", "nodejs-lts-iron", "nodejs-lts-hydrogen"]

[[module]]
id = "js-runtimes"
name = "pnpm, Bun and Deno"
description = "Extra JavaScript package managers and runtimes."
packages = ["pnpm", "bun", "deno"]

[[module]]
id = "go"
name = "Go"
description = "The Go toolchain."
packages = ["go"]

[[module]]
id = "c-cpp"
name = "C/C++ toolchain"
description = "CMake, Clang and GDB (GCC and make come with base-devel)."
profiles = ["developer"]
requires = ["build-tools"]
packages = ["cmake", "clang", "gdb"]

[[module]]
id = "java"
name = "Java (JDK 21 LTS)"
description = "OpenJDK 21, the current long-term-support release."
packages = ["jdk21-openjdk"]
notes = ["Newer JDKs: jdk-openjdk. Switch with archlinux-java."]

[[module]]
id = "dotnet"
name = ".NET SDK"
description = "The .NET SDK."
packages = ["dotnet-sdk"]

[[module]]
id = "zig"
name = "Zig"
description = "The Zig compiler."
packages = ["zig"]

[[module]]
id = "mise"
name = "mise"
description = "Per-project tool versions (Node, Python, Go, …) from one config file."
packages = ["mise"]
notes = ["Activate it in your shell: see `mise activate --help`."]

[[module]]
id = "git-tools"
name = "Git tools"
description = "GitHub CLI, lazygit and delta (better diffs)."
profiles = ["developer"]
packages = ["github-cli", "lazygit", "git-delta"]

[[module]]
id = "jujutsu"
name = "Jujutsu (jj)"
description = "Git-compatible version control with a simpler model."
packages = ["jujutsu"]

[[module]]
id = "cli-tools"
name = "Modern CLI tools"
description = "fzf, ripgrep, fd, bat, eza, zoxide, btop and fastfetch."
profiles = ["developer"]
packages = ["fzf", "ripgrep", "fd", "bat", "eza", "zoxide", "btop", "fastfetch"]

[[module]]
id = "neovim"
name = "Neovim"
description = "Terminal text editor."
profiles = ["developer"]
packages = ["neovim"]

[[module]]
id = "helix"
name = "Helix"
description = "Modal terminal editor with built-in LSP support."
packages = ["helix"]

[[module]]
id = "code-oss"
name = "Code - OSS"
description = "Arch's open-source build of VS Code, using Open VSX extensions."
conflicts = ["vscode"]
packages = ["code"]

[[module]]
id = "vscodium"
name = "VSCodium"
description = "VS Code without Microsoft telemetry, using the Open VSX extension store."
requires = ["aur-helper"]
aur = ["vscodium-bin"]

[[module]]
id = "vscode"
name = "Visual Studio Code"
description = "Microsoft's build of VS Code, with its extension marketplace."
risk = "moderate"
requires = ["aur-helper"]
conflicts = ["code-oss"]
aur = ["visual-studio-code-bin"]

[[module]]
id = "zed"
name = "Zed"
description = "Fast, collaborative code editor."
packages = ["zed"]

[[module]]
id = "ghostty"
name = "Ghostty"
description = "GPU-accelerated terminal emulator."
packages = ["ghostty"]

[[module]]
id = "kitty"
name = "kitty"
description = "GPU-accelerated terminal."
packages = ["kitty"]

[[module]]
id = "alacritty"
name = "Alacritty"
description = "Minimal GPU-accelerated terminal."
packages = ["alacritty"]

[[module]]
id = "fish"
name = "fish"
description = "Friendly interactive shell. Installed only; switch with `chsh -s /usr/bin/fish`."
packages = ["fish"]

[[module]]
id = "zsh"
name = "Zsh"
description = "Z shell with extra completions. Installed only; switch with `chsh -s /usr/bin/zsh`."
packages = ["zsh", "zsh-completions"]

[[module]]
id = "docker"
name = "Docker"
description = "Docker engine with compose and buildx; adds you to the docker group."
risk = "moderate"
profiles = ["developer"]
packages = ["docker", "docker-compose", "docker-buildx"]
enable = ["docker.socket"]
groups = ["docker"]
notes = ["Membership of the docker group is root-equivalent."]

[[module]]
id = "podman"
name = "Podman"
description = "Daemonless, rootless containers."
packages = ["podman", "podman-compose", "buildah"]

[[module]]
id = "distrobox"
name = "Distrobox"
description = "Other distros' userlands in containers, integrated with your desktop."
requires = ["podman"]
packages = ["distrobox"]

[[module]]
id = "virt-manager"
name = "Virtual machines (virt-manager)"
description = "QEMU/KVM virtual machines with libvirt and a GUI, including UEFI and TPM for Windows 11 guests."
risk = "moderate"
packages = ["virt-manager", "qemu-desktop", "libvirt", "dnsmasq", "swtpm", "edk2-ovmf"]
enable = ["libvirtd.socket"]
groups = ["libvirt"]
notes = ["If the default network isn't running, start it with `sudo virsh net-autostart default && sudo virsh net-start default`."]
