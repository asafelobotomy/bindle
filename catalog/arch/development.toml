[category]
id = "development"
name = "Development"
description = "Toolchains, containers and editors."
order = 50

[[module]]
id = "rustup"
name = "Rust (rustup)"
description = "rustup with the stable toolchain."
profiles = ["developer"]
packages = ["rustup"]
package_conflicts = ["rust", "cargo", "rustfmt"]
user_commands = [{ argv = ["rustup", "default", "stable"], unless = [{ path = "~/.rustup/settings.toml", contains = 'default_toolchain = "stable' }] }]
notes = ["Replaces the distro 'rust' package if it is installed (rustup provides rust and cargo)."]

[[module]]
id = "nodejs"
name = "Node.js"
description = "Node.js LTS runtime with npm."
profiles = ["developer"]
packages = ["nodejs-lts-krypton", "npm"]
package_conflicts = ["nodejs", "nodejs-lts-jod", "nodejs-lts-iron", "nodejs-lts-hydrogen"]

[[module]]
id = "python"
name = "Python tooling"
description = "Python with pip, pipx and uv."
profiles = ["developer"]
packages = ["python", "python-pip", "python-pipx", "uv"]

[[module]]
id = "docker"
name = "Docker"
description = "Docker engine with compose and buildx; adds you to the docker group."
risk = "moderate"
profiles = ["developer"]
packages = ["docker", "docker-compose", "docker-buildx"]
enable = ["docker.socket"]
groups = ["docker"]
notes = ["Membership of the docker group is root-equivalent."]

[[module]]
id = "podman"
name = "Podman"
description = "Daemonless, rootless containers."
packages = ["podman"]

[[module]]
id = "neovim"
name = "Neovim"
description = "Terminal editor."
profiles = ["developer"]
packages = ["neovim"]

[[module]]
id = "vscode"
name = "Visual Studio Code"
description = "Microsoft build from the AUR."
risk = "moderate"
requires = ["aur-helper"]
aur = ["visual-studio-code-bin"]
