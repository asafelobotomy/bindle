[category]
id = "gaming"
name = "Gaming"
description = "Steam, Wine and performance overlays."
order = 60

[[module]]
id = "steam"
name = "Steam"
description = "Valve's Steam client (Proton included)."
profiles = ["gaming"]
requires = ["multilib", "gpu-driver"]
packages = ["steam"]

[[module]]
id = "gamemode"
name = "GameMode"
description = "On-demand CPU governor and scheduler tweaks while games run."
profiles = ["gaming"]
requires = ["multilib"]
packages = ["gamemode", "lib32-gamemode"]
groups = ["gamemode"]

[[module]]
id = "mangohud"
name = "MangoHud"
description = "FPS, frametime and temperature overlay."
profiles = ["gaming"]
requires = ["multilib"]
packages = ["mangohud", "lib32-mangohud"]

[[module]]
id = "wine"
name = "Wine"
description = "Wine staging with winetricks."
profiles = ["gaming"]
requires = ["multilib"]
packages = ["wine-staging", "winetricks"]

[[module]]
id = "lutris"
name = "Lutris"
description = "Launcher for GOG, Epic, emulators and Wine games."
requires = ["wine"]
packages = ["lutris"]

[[module]]
id = "heroic"
name = "Heroic Games Launcher"
description = "Epic, GOG and Amazon launcher (AUR)."
risk = "moderate"
requires = ["aur-helper"]
aur = ["heroic-games-launcher-bin"]

[[module]]
id = "romforge"
name = "romforge (ROM library)"
description = "Identify, tidy, enrich and play your ROM collection. By asafelobotomy; AppImage from its GitHub release, installed to ~/.local/bin."
packages = ["fuse2"]
[[module.release]]
repo = "asafelobotomy/romforge"
tag = "v0.15.0"
asset = "romforge_0.15.0_amd64.AppImage"
sha256 = "b6144f61a37edbc72c4af1ff3b17d7b32c5d98f49befc190b9301c008c9f9037"
name = "romforge"

[[module]]
id = "reshadelinux"
name = "ReShadeLinux"
description = "Install the official ReShade runtime for Wine and Proton games. By asafelobotomy; AppImage from its GitHub release, installed to ~/.local/bin."
packages = ["fuse2"]
[[module.release]]
repo = "asafelobotomy/reshadelinux"
tag = "v1.4.1"
asset = "reshadelinux-1.4.1-x86_64.AppImage"
sha256 = "974b66a99d9c3447161a111a61deca49381d587330494dedc627107e64ec0bae"
name = "reshadelinux"
