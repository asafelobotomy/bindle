[category]
id = "gaming"
name = "Gaming"
description = "Steam, Wine and Proton tools, launchers, overlays and emulators."
order = 60

[[module]]
id = "steam"
group = "Steam & Proton"
name = "Steam"
description = "Valve's Steam client (Proton included)."
profiles = ["gaming"]
requires = ["multilib", "gpu-driver"]
# steam-devices: udev rules for controllers and VR headsets.
packages = ["steam", "steam-devices"]

[[module]]
id = "gamemode"
group = "Performance & overlays"
name = "GameMode"
description = "On-demand CPU governor and scheduler tweaks while games run."
profiles = ["gaming"]
requires = ["multilib"]
packages = ["gamemode", "lib32-gamemode"]
groups = ["gamemode"]

[[module]]
id = "mangohud"
group = "Performance & overlays"
name = "MangoHud"
description = "FPS, frametime and temperature overlay."
profiles = ["gaming"]
requires = ["multilib"]
packages = ["mangohud", "lib32-mangohud"]

[[module]]
id = "goverlay"
group = "Performance & overlays"
name = "GOverlay"
description = "GUI to configure MangoHud."
requires = ["mangohud"]
packages = ["goverlay"]

[[module]]
id = "gamescope"
group = "Performance & overlays"
name = "gamescope"
description = "Micro-compositor for games: upscaling, frame limits, HDR."
profiles = ["gaming"]
packages = ["gamescope"]

[[module]]
id = "wine"
group = "Wine & launchers"
name = "Wine"
description = "Wine (staging) with winetricks, Mono and Gecko."
profiles = ["gaming"]
requires = ["multilib"]
packages = ["wine-staging", "winetricks", "wine-mono", "wine-gecko"]

[[module]]
id = "protontricks"
group = "Steam & Proton"
name = "Protontricks"
description = "winetricks for Proton games in Steam."
profiles = ["gaming"]
requires = ["steam"]
packages = ["protontricks"]

[[module]]
id = "protonup-qt"
group = "Steam & Proton"
name = "ProtonUp-Qt"
description = "Install and update GE-Proton and other compatibility tools."
requires = ["aur-helper", "steam"]
aur = ["protonup-qt"]

[[module]]
id = "lutris"
group = "Wine & launchers"
name = "Lutris"
description = "Launcher for GOG, Epic, emulators and Wine games."
requires = ["wine"]
packages = ["lutris", "umu-launcher"]

[[module]]
id = "heroic"
group = "Wine & launchers"
name = "Heroic Games Launcher"
description = "Launcher for Epic, GOG and Amazon games."
risk = "moderate"
requires = ["aur-helper"]
aur = ["heroic-games-launcher-bin"]

[[module]]
id = "bottles"
group = "Wine & launchers"
name = "Bottles"
description = "Run Windows software in managed Wine prefixes."
notes = ["Upstream recommends the Flathub build; this is the AUR package."]
requires = ["aur-helper"]
aur = ["bottles"]

[[module]]
id = "discord"
group = "Chat"
name = "Discord"
description = "Discord voice and text chat."
conflicts = ["vesktop"]
packages = ["discord"]

[[module]]
id = "vesktop"
group = "Chat"
name = "Vesktop"
description = "Discord client with better Wayland screen sharing."
requires = ["aur-helper"]
conflicts = ["discord"]
aur = ["vesktop-bin"]

[[module]]
id = "lact"
group = "Performance & overlays"
name = "LACT (GPU control)"
description = "Monitor, overclock and set fan curves on AMD, NVIDIA and Intel GPUs."
when = ["!virt"]
packages = ["lact"]
enable = ["lactd.service"]

[[module]]
id = "emulators"
group = "Emulation & streaming"
name = "Emulators"
description = "RetroArch, Dolphin (GameCube/Wii) and PPSSPP (PSP)."
packages = ["retroarch", "dolphin-emu", "ppsspp"]

[[module]]
id = "pcsx2"
group = "Emulation & streaming"
name = "PCSX2"
description = "PlayStation 2 emulator."
requires = ["aur-helper"]
aur = ["pcsx2"]

[[module]]
id = "azahar"
group = "Emulation & streaming"
name = "Azahar"
description = "Nintendo 3DS emulator (successor to Citra)."
requires = ["aur-helper"]
aur = ["azahar"]

[[module]]
id = "moonlight"
group = "Emulation & streaming"
name = "Moonlight"
description = "Stream games from a Sunshine or GeForce host."
packages = ["moonlight-qt"]

[[module]]
id = "prismlauncher"
group = "Wine & launchers"
name = "Prism Launcher"
description = "Minecraft launcher with multiple instances and mod pack support."
packages = ["prismlauncher"]

[[module]]
id = "romforge"
group = "Emulation & streaming"
name = "romforge (ROM library)"
description = "Identifies, tidies, enriches and plays your ROM collection. By asafelobotomy."
packages = ["fuse2"]
[[module.release]]
repo = "asafelobotomy/romforge"
tag = "v0.15.0"
asset = "romforge_0.15.0_amd64.AppImage"
sha256 = "b6144f61a37edbc72c4af1ff3b17d7b32c5d98f49befc190b9301c008c9f9037"
name = "romforge"

[[module]]
id = "reshadelinux"
group = "Performance & overlays"
name = "ReShadeLinux"
description = "Installs the official ReShade runtime for Wine and Proton games. By asafelobotomy."
packages = ["fuse2"]
[[module.release]]
repo = "asafelobotomy/reshadelinux"
tag = "v1.4.1"
asset = "reshadelinux-1.4.1-x86_64.AppImage"
sha256 = "974b66a99d9c3447161a111a61deca49381d587330494dedc627107e64ec0bae"
name = "reshadelinux"
