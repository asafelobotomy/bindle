[category]
id = "hardware"
name = "Hardware"
description = "Graphics, audio, power, printing, scanning and peripherals."
order = 20

[[module]]
id = "gpu-driver"
name = "Graphics drivers"
description = "Mesa and Vulkan for AMD and Intel; NVIDIA's own driver (nvidia-open) for Turing and newer cards on Arch. Keeps a driver you already have."
default = true
builtin = "gpu"

# NVIDIA's own driver is the recommended one wherever it exists: pre-selected
# on the cards that need this branch, and unticking it keeps nouveau.
[[module]]
id = "nvidia-legacy"
name = "NVIDIA driver for older cards (580xx)"
description = "NVIDIA's own driver for GTX 700 (Maxwell), 900 and 10 series and Titan V cards, which the current driver no longer supports. Recommended over the open-source nouveau driver: full speed, video decoding and power management."
default = true
when = ["nvidia-legacy", "distro:arch"]
requires = ["aur-helper"]
aur = ["nvidia-580xx-dkms", "nvidia-580xx-utils"]
builtin = "nvidia-legacy"

[[module]]
id = "audio-firmware"
name = "Audio firmware"
description = "Sound Open Firmware and ALSA profiles: many Intel and AMD laptops have no sound without them."
default = true
when = ["!virt"]
packages = ["sof-firmware", "alsa-firmware", "alsa-ucm-conf"]

[[module]]
id = "audio-pipewire"
name = "PipeWire audio"
description = "PipeWire with PulseAudio, ALSA and JACK compatibility, managed by WirePlumber."
profiles = ["desktop", "gaming", "developer"]
# rtkit: PipeWire asks RealtimeKit for realtime audio threads; without it every session logs
# "RTKit error: ServiceUnknown" and audio runs at normal priority (crackles under load).
packages = ["pipewire", "pipewire-pulse", "pipewire-alsa", "pipewire-jack", "wireplumber", "alsa-utils", "rtkit"]
# pulseaudio-* modules depend on pulseaudio by name: replaced along with it.
package_conflicts = ["pulseaudio", "pulseaudio-alsa", "pulseaudio-bluetooth", "pulseaudio-jack", "pulseaudio-zeroconf", "pulseaudio-equalizer", "pulseaudio-lirc", "jack", "jack2", "jack2-dbus", "pipewire-jack-client"]

[[module]]
id = "bluetooth"
name = "Bluetooth"
description = "BlueZ, with the Bluetooth service enabled."
profiles = ["desktop", "gaming", "developer"]
when = ["bluetooth"]
packages = ["bluez", "bluez-utils"]
enable = ["bluetooth.service"]

[[module]]
id = "power-profiles"
name = "Power profiles (power-profiles-daemon)"
description = "Balanced, performance and power-saver modes that desktops switch between."
profiles = ["desktop", "gaming", "developer"]
when = ["laptop"]
conflicts = ["tlp"]
packages = ["power-profiles-daemon"]
package_conflicts = ["tlp-pd", "tuned-ppd"]
enable = ["power-profiles-daemon.service"]

[[module]]
id = "tlp"
name = "Laptop power tuning (TLP)"
description = "Aggressive battery tuning in place of power-profiles-daemon; tlp-pd keeps the desktop's power-mode switch working."
risk = "moderate"
when = ["laptop"]
conflicts = ["power-profiles"]
packages = ["tlp", "tlp-pd"]
package_conflicts = ["power-profiles-daemon", "tuned", "tuned-ppd"]
enable = ["tlp.service", "tlp-pd.service"]
# A masked unit is a symlink to /dev/null, which reads as empty.
root_commands = [{ argv = ["systemctl", "mask", "systemd-rfkill.service", "systemd-rfkill.socket"], unless = [{ path = "/etc/systemd/system/systemd-rfkill.service", content = "" }, { path = "/etc/systemd/system/systemd-rfkill.socket", content = "" }] }]

[[module]]
id = "tlp-rdw"
name = "Radio switching (tlp-rdw)"
description = "Turns Wi-Fi, Bluetooth and WWAN on and off on network events."
risk = "moderate"
when = ["laptop", "nm"]
requires = ["tlp"]
packages = ["tlp-rdw"]
enable = ["NetworkManager-dispatcher.service"]

[[module]]
id = "thermald"
name = "Intel thermal control (thermald)"
description = "Manages cooling on Intel laptops before the firmware has to throttle."
when = ["cpu:intel", "laptop", "!virt"]
packages = ["thermald"]
enable = ["thermald.service"]
notes = ["Some laptops' firmware already does this well; turn it off again if fans or performance get worse."]

[[module]]
id = "fingerprint"
name = "Fingerprint login (fprintd)"
description = "Fingerprint reader support. Enrol with `fprintd-enroll`; GNOME and Plasma offer it in their settings."
when = ["laptop", "!virt"]
packages = ["fprintd"]

[[module]]
id = "printing"
name = "Printing (CUPS)"
description = "CUPS with network printer discovery (Avahi, cups-browsed) and driverless USB printing."
notes = ["HP printers may also want hplip. Scanners: see the Scanning modules."]
# cups-browsed + Avahi find network (IPP Everywhere) printers; ipp-usb drives
# driverless USB printers.
packages = ["cups", "cups-pdf", "cups-browsed", "avahi", "ipp-usb"]
enable = ["cups.socket", "cups-browsed.service", "avahi-daemon.socket"]

[[module]]
id = "scanning-qt"
name = "Scanning (Skanpage)"
description = "SANE with driverless network scanning (eSCL/WSD) and KDE's Skanpage."
when = ["toolkit:qt"]
packages = ["sane", "sane-airscan", "skanpage"]

[[module]]
id = "scanning-gtk"
name = "Scanning (Document Scanner)"
description = "SANE with driverless network scanning (eSCL/WSD) and GNOME's Document Scanner."
when = ["!toolkit:qt"]
packages = ["sane", "sane-airscan", "simple-scan"]

[[module]]
id = "solaar"
name = "Solaar (Logitech devices)"
description = "Pair and configure Logitech Unifying and Bolt receivers and devices."
when = ["!virt"]
packages = ["solaar"]

[[module]]
id = "piper"
name = "Piper (gaming mice)"
description = "Configure buttons, DPI and LEDs on gaming mice through libratbag."
when = ["!virt"]
packages = ["piper"]

[[module]]
id = "openrgb"
name = "OpenRGB"
description = "Control RGB lighting on motherboards, RAM, GPUs and peripherals from one app."
when = ["!virt"]
packages = ["openrgb"]
notes = ["Some motherboard and RAM lighting needs the i2c-dev module: `echo i2c-dev | sudo tee /etc/modules-load.d/i2c.conf`."]

[[module]]
id = "android-tools"
name = "Android tools"
description = "adb and fastboot for phones and tablets."
packages = ["android-tools"]
