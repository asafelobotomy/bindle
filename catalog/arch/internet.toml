[category]
id = "internet"
name = "Internet"
description = "Browsers, mail, messaging, Proton, sync, VPN and downloads."
order = 42

[[module]]
id = "firefox"
group = "Browsers"
name = "Firefox"
description = "Mozilla's web browser."
when = ["desktop"]
profiles = ["desktop", "gaming", "developer"]
packages = ["firefox"]

[[module]]
id = "chromium"
group = "Browsers"
name = "Chromium"
description = "Open-source base of Google Chrome."
packages = ["chromium"]

[[module]]
id = "brave"
group = "Browsers"
name = "Brave"
description = "Privacy-focused Chromium browser with built-in ad blocking."
requires = ["aur-helper"]
aur = ["brave-bin"]

[[module]]
id = "brave-origin"
group = "Browsers"
name = "Brave Origin"
description = "Brave without extras such as Rewards, Wallet and Leo."
requires = ["aur-helper"]
aur = ["brave-origin-bin"]

[[module]]
id = "vivaldi"
group = "Browsers"
name = "Vivaldi"
description = "Highly customisable Chromium-based browser."
packages = ["vivaldi"]

[[module]]
id = "zen-browser"
group = "Browsers"
name = "Zen Browser"
description = "Firefox-based browser with vertical tabs and workspaces."
requires = ["aur-helper"]
aur = ["zen-browser-bin"]

[[module]]
id = "google-chrome"
group = "Browsers"
name = "Google Chrome"
description = "Google's Chrome browser."
risk = "moderate"
requires = ["aur-helper"]
aur = ["google-chrome"]

[[module]]
id = "thunderbird"
group = "Mail & messaging"
name = "Thunderbird"
description = "Mail, calendar and contacts."
packages = ["thunderbird"]

[[module]]
id = "signal"
group = "Mail & messaging"
name = "Signal"
description = "Signal messenger."
packages = ["signal-desktop"]

[[module]]
id = "telegram"
group = "Mail & messaging"
name = "Telegram"
description = "Telegram messenger."
packages = ["telegram-desktop"]

[[module]]
id = "element"
group = "Mail & messaging"
name = "Element"
description = "Matrix chat client."
packages = ["element-desktop"]

[[module]]
id = "proton-mail"
group = "Proton"
name = "Proton Mail"
description = "Proton Mail and Calendar desktop app."
requires = ["aur-helper"]
aur = ["proton-mail-bin"]

[[module]]
id = "proton-mail-bridge"
group = "Proton"
name = "Proton Mail Bridge"
description = "Use Proton Mail from Thunderbird or any IMAP/SMTP client."
packages = ["protonmail-bridge"]

[[module]]
id = "proton-pass"
group = "Proton"
name = "Proton Pass"
description = "Proton's password manager."
requires = ["aur-helper"]
aur = ["proton-pass-bin"]

[[module]]
id = "proton-pass-cli"
group = "Proton"
name = "Proton Pass (CLI)"
description = "Proton Pass on the command line (`pass-cli`), from Proton's own releases."
requires = ["aur-helper"]
package_conflicts = ["pass-cli"]
aur = ["proton-pass-cli-bin"]
notes = ["Sign in with `pass-cli login`.", "The AUR package named `pass-cli` is a different password manager that installs the same command; it has to go first."]

[[module]]
id = "proton-vpn"
group = "Proton"
name = "Proton VPN"
description = "Proton VPN app."
packages = ["proton-vpn-gtk-app"]

[[module]]
id = "proton-authenticator"
group = "Proton"
name = "Proton Authenticator"
description = "Proton's 2FA code app, with encrypted sync."
requires = ["aur-helper"]
aur = ["proton-authenticator-bin"]

[[module]]
id = "proton-drive-cli"
group = "Proton"
name = "Proton Drive (CLI)"
description = "Proton Drive command-line client; there is no Proton Drive desktop app for Linux yet."
requires = ["aur-helper"]
aur = ["proton-drive-cli-bin"]

[[module]]
id = "syncthing"
group = "Sync & networking"
name = "Syncthing"
description = "Peer-to-peer file sync between your devices, running as your user."
packages = ["syncthing"]
user_commands = [{ argv = ["systemctl", "--user", "enable", "--now", "syncthing.service"], unless = [{ path = "~/.config/systemd/user/default.target.wants/syncthing.service" }] }]
notes = ["Open http://127.0.0.1:8384 to pair devices."]

[[module]]
id = "nextcloud-client"
group = "Sync & networking"
name = "Nextcloud client"
description = "Desktop sync client for Nextcloud servers."
packages = ["nextcloud-client"]

[[module]]
id = "tailscale"
group = "Sync & networking"
name = "Tailscale"
description = "WireGuard mesh VPN between your devices."
packages = ["tailscale"]
enable = ["tailscaled.service"]
notes = ["Run `run0 tailscale up` afterwards to sign in."]

[[module]]
id = "scale_tail"
group = "Sync & networking"
name = "scale_tail (Tailscale tray)"
description = "System-tray control centre for Tailscale: connect, switch exit nodes and accounts, start on login. By asafelobotomy."
requires = ["tailscale"]
packages = ["fuse2"]
[[module.release]]
repo = "asafelobotomy/scale_tail"
tag = "v0.6.0"
asset = "scale_tail-0.6.0-x86_64.AppImage"
sha256 = "edb335b9283154568d3e71ff4760b2ad8eac5d0f25839817bdcc0c9b551bc057"
name = "scale_tail"

[[module]]
id = "qbittorrent"
group = "Downloads"
name = "qBittorrent"
description = "BitTorrent client."
conflicts = ["qbittorrent-enhanced"]
packages = ["qbittorrent"]

[[module]]
id = "qbittorrent-enhanced"
group = "Downloads"
name = "qBittorrent Enhanced Edition"
description = "qBittorrent fork that blocks leeching clients and auto-updates trackers."
requires = ["aur-helper"]
conflicts = ["qbittorrent"]
package_conflicts = ["qbittorrent"]
aur = ["qbittorrent-enhanced"]
notes = ["Builds from source, which takes a while."]

[[module]]
id = "qbit-plugin-dl"
group = "Downloads"
name = "qbit Plugin Manager"
description = "Finds and installs qBittorrent search plugins from allowlisted catalogs. By asafelobotomy."
notes = ["Works with qBittorrent or qBittorrent Enhanced Edition: install one of them too."]
# No `requires`: it would pull in plain qbittorrent, which conflicts with the
# Enhanced fork. `when = ["installed:qbittorrent"]` would hide it on a fresh plan
# that selects either client in the same run, so it stands alone with a note.
packages = ["fuse2"]
[[module.release]]
repo = "asafelobotomy/qbit-plugin-dl"
tag = "v0.2.1"
asset = "qbit-plugin-dl-x86_64.AppImage"
sha256 = "43bd1684d54697dcd8c1fffdfd9192b5908cfc75fb9659e2d25cc62fb75af104"
name = "qbit-plugin-dl"

[[module]]
id = "hauler"
group = "Downloads"
name = "hauler (download manager)"
description = "Fast, resumable downloads over parallel connections; CLI, daemon and Kirigami app. By asafelobotomy."
[[module.release]]
repo = "asafelobotomy/hauler"
tag = "v0.1.2"
asset = "hauler-0.1.2-1-x86_64.pkg.tar.zst"
sha256 = "c464fcf42aceaf2a61c65cedbe58358829f9366df7eddeeb59466d081abe5a1b"
name = "hauler"

[[module]]
id = "av-morning-star"
group = "Downloads"
name = "AV Morning Star (video downloader)"
description = "Downloads video and audio from YouTube, Odysee and 1000+ sites (a yt-dlp front end). By asafelobotomy."
packages = ["fuse2", "yt-dlp"]
[[module.release]]
repo = "asafelobotomy/AV-Morning-Star"
tag = "v0.4.2"
asset = "AV-Morning-Star-0.4.2-x86_64.AppImage"
sha256 = "e12b3c7d125936b6ed9776b2da1513f9a1e9c10e466e6f8a9bde0a581e8d4a47"
name = "av-morning-star"
