[category]
id = "internet"
name = "Internet"
description = "Browsers, mail, messaging, Proton, sync, VPN and downloads."
order = 42

[[module]]
id = "firefox"
group = "Browsers"
name = "Firefox"
description = "Mozilla's web browser."
when = ["desktop"]
profiles = ["desktop", "gaming", "developer"]
packages = ["firefox"]

[[module]]
id = "chromium"
group = "Browsers"
name = "Chromium"
description = "Open-source base of Google Chrome."
packages = ["chromium"]

[[module]]
id = "brave"
group = "Browsers"
name = "Brave"
description = "Privacy-focused Chromium browser with built-in ad blocking."
requires = ["aur-helper"]
aur = ["brave-bin"]

[[module]]
id = "brave-origin"
group = "Browsers"
name = "Brave Origin"
description = "Brave without extras such as Rewards, Wallet and Leo."
requires = ["aur-helper"]
aur = ["brave-origin-bin"]

[[module]]
id = "vivaldi"
group = "Browsers"
name = "Vivaldi"
description = "Highly customisable Chromium-based browser."
packages = ["vivaldi"]

[[module]]
id = "zen-browser"
group = "Browsers"
name = "Zen Browser"
description = "Firefox-based browser with vertical tabs and workspaces."
requires = ["aur-helper"]
aur = ["zen-browser-bin"]

[[module]]
id = "google-chrome"
group = "Browsers"
name = "Google Chrome"
description = "Google's Chrome browser."
risk = "moderate"
requires = ["aur-helper"]
aur = ["google-chrome"]

[[module]]
id = "thunderbird"
group = "Mail & messaging"
name = "Thunderbird"
description = "Mail, calendar and contacts."
packages = ["thunderbird"]

[[module]]
id = "signal"
group = "Mail & messaging"
name = "Signal"
description = "Signal messenger."
packages = ["signal-desktop"]

[[module]]
id = "telegram"
group = "Mail & messaging"
name = "Telegram"
description = "Telegram messenger."
packages = ["telegram-desktop"]

[[module]]
id = "element"
group = "Mail & messaging"
name = "Element"
description = "Matrix chat client."
packages = ["element-desktop"]

[[module]]
id = "proton-mail"
group = "Proton"
name = "Proton Mail"
description = "Proton Mail and Calendar desktop app."
requires = ["aur-helper"]
aur = ["proton-mail-bin"]

[[module]]
id = "proton-mail-bridge"
group = "Proton"
name = "Proton Mail Bridge"
description = "Use Proton Mail from Thunderbird or any IMAP/SMTP client."
packages = ["protonmail-bridge"]

[[module]]
id = "proton-pass"
group = "Proton"
name = "Proton Pass"
description = "Proton's password manager."
requires = ["aur-helper"]
aur = ["proton-pass-bin"]

[[module]]
id = "proton-pass-cli"
group = "Proton"
name = "Proton Pass (CLI)"
description = "Proton Pass on the command line (`pass-cli`), from Proton's own releases."
requires = ["aur-helper"]
package_conflicts = ["pass-cli"]
aur = ["proton-pass-cli-bin"]
notes = ["Sign in with `pass-cli login`.", "The AUR package named `pass-cli` is a different password manager that installs the same command; it has to go first."]

[[module]]
id = "proton-vpn"
group = "Proton"
name = "Proton VPN"
description = "Proton VPN app."
packages = ["proton-vpn-gtk-app"]

[[module]]
id = "proton-authenticator"
group = "Proton"
name = "Proton Authenticator"
description = "Proton's 2FA code app, with encrypted sync."
requires = ["aur-helper"]
aur = ["proton-authenticator-bin"]

[[module]]
id = "proton-drive-cli"
group = "Proton"
name = "Proton Drive (CLI)"
description = "Proton Drive command-line client; there is no Proton Drive desktop app for Linux yet."
requires = ["aur-helper"]
aur = ["proton-drive-cli-bin"]

[[module]]
id = "syncthing"
group = "Sync & networking"
name = "Syncthing"
description = "Peer-to-peer file sync between your devices, running as your user."
packages = ["syncthing"]
user_commands = [{ argv = ["systemctl", "--user", "enable", "--now", "syncthing.service"], unless = [{ path = "~/.config/systemd/user/default.target.wants/syncthing.service" }] }]
notes = ["Open http://127.0.0.1:8384 to pair devices."]

[[module]]
id = "nextcloud-client"
group = "Sync & networking"
name = "Nextcloud client"
description = "Desktop sync client for Nextcloud servers."
packages = ["nextcloud-client"]

[[module]]
id = "tailscale"
group = "Sync & networking"
name = "Tailscale"
description = "WireGuard mesh VPN between your devices."
packages = ["tailscale"]
enable = ["tailscaled.service"]
notes = ["Run `run0 tailscale up` afterwards to sign in."]

[[module]]
id = "scale_tail"
group = "Sync & networking"
name = "scale_tail (Tailscale tray)"
description = "System-tray control centre for Tailscale: connect, switch exit nodes and accounts, start on login. By asafelobotomy."
requires = ["tailscale", "aur-helper"]
aur = ["scale_tail"]
# Bindle installed it as an AppImage before it came from the AUR: that copy goes once the
# package is in (only when Bindle's own desktop entry for it is still there).
[[module.user_commands]]
argv = ["sh", "-c", "e=\"$HOME/.local/share/applications/bindle-$0.desktop\"; if grep -qs '^X-Bindle-Asset=' \"$e\"; then rm -f \"$HOME/.local/bin/$0\" \"$e\"; fi", "scale_tail"]
unless = [{ path = "/usr/bin/scale_tail" }]

[[module]]
id = "qbittorrent"
group = "Downloads"
name = "qBittorrent"
description = "BitTorrent client."
conflicts = ["qbittorrent-enhanced"]
packages = ["qbittorrent"]

[[module]]
id = "qbittorrent-enhanced"
group = "Downloads"
name = "qBittorrent Enhanced Edition"
description = "qBittorrent fork that blocks leeching clients and auto-updates trackers."
requires = ["aur-helper"]
conflicts = ["qbittorrent"]
package_conflicts = ["qbittorrent"]
aur = ["qbittorrent-enhanced"]
notes = ["Builds from source, which takes a while."]

# uQ's torrent app: qBittorrent Enhanced Edition's headless engine (qbittorrent-enhanced-nox,
# which provides qbittorrent-nox, so no qBittorrent window comes with it) in the background
# with a window in uQ's style. uQ pre-selects it (desktops.toml `apps`) in place of the
# qBittorrent modules. It can sit beside either of them (its engine keeps its own profile).
# The Enhanced engine conflicts with plain qbittorrent-nox, which it replaces. It becomes the
# app for .torrent files and magnet links unless something other than qBittorrent has them.
[[module]]
id = "uqbit"
group = "Downloads"
name = "uQbit (torrents)"
description = "Downloads and seeds torrents with qBittorrent Enhanced Edition's engine in the background (no qBittorrent window), in a window that follows the uQ theme; opens magnet links and .torrent files, searches with qBittorrent's search plugins, and keeps torrents private (encryption, a blocklist, optional VPN-only). By asafelobotomy."
requires = ["aur-helper"]
package_conflicts = ["qbittorrent-nox"]
packages = ["python"]
aur = ["qbittorrent-enhanced-nox", "uqbit"]
notes = ["The engine (qbittorrent-enhanced-nox) builds from source, which takes a while."]
[[module.user_commands]]
argv = ["sh", "-c", 'case "$(xdg-mime query default x-scheme-handler/magnet 2>/dev/null)" in ""|org.qbittorrent.qBittorrent.desktop|qbittorrent.desktop) exec uqbit default set ;; esac']
unless = [{ path = "~/.config/mimeapps.list", contains = "x-scheme-handler/magnet=io.github.asafelobotomy.uqbit.desktop" }]

[[module]]
id = "qbit-plugin-dl"
group = "Downloads"
name = "qbit Plugin Manager"
description = "Finds and installs qBittorrent search plugins from allowlisted catalogs. By asafelobotomy."
notes = ["Works with qBittorrent or qBittorrent Enhanced Edition: install one of them too."]
# No `requires`: it would pull in plain qbittorrent, which conflicts with the
# Enhanced fork. `when = ["installed:qbittorrent"]` would hide it on a fresh plan
# that selects either client in the same run, so it stands alone with a note.
packages = ["fuse2"]
[[module.release]]
repo = "asafelobotomy/qbit-plugin-dl"
tag = "v0.2.1"
asset = "qbit-plugin-dl-x86_64.AppImage"
sha256 = "43bd1684d54697dcd8c1fffdfd9192b5908cfc75fb9659e2d25cc62fb75af104"
name = "qbit-plugin-dl"

[[module]]
id = "hauler"
group = "Downloads"
name = "hauler (download manager)"
description = "Fast, resumable downloads over parallel connections; CLI, daemon and Kirigami app. By asafelobotomy."
requires = ["aur-helper"]
# The same package name as the release package Bindle installed before, so that one updates in place.
aur = ["hauler"]

[[module]]
id = "av-morning-star"
group = "Downloads"
name = "AV Morning Star (video downloader)"
description = "Downloads video and audio from YouTube, Odysee and 1000+ sites (a yt-dlp front end). By asafelobotomy."
requires = ["aur-helper"]
aur = ["av-morning-star"]
# Bindle installed it as an AppImage before it came from the AUR: that copy goes once the
# package is in (only when Bindle's own desktop entry for it is still there).
[[module.user_commands]]
argv = ["sh", "-c", "e=\"$HOME/.local/share/applications/bindle-$0.desktop\"; if grep -qs '^X-Bindle-Asset=' \"$e\"; then rm -f \"$HOME/.local/bin/$0\" \"$e\"; fi", "av-morning-star"]
unless = [{ path = "/usr/bin/av-morning-star" }]
