[category]
id = "security"
name = "Security"
description = "Firewalls, snapshots, password managers and backups."
order = 70

[[module]]
id = "ufw"
group = "Firewall"
name = "Firewall (ufw)"
description = "Blocks incoming connections and allows outgoing ones."
profiles = ["desktop", "gaming", "developer"]
conflicts = ["firewalld"]
packages = ["ufw"]
enable = ["ufw.service"]
# Each command is skipped once its effect is on disk, so re-applying is a no-op.
root_commands = [
  { argv = ["ufw", "default", "deny", "incoming"], unless = [{ path = "/etc/ufw/ufw.conf", contains = "ENABLED=yes" }] },
  { argv = ["ufw", "default", "allow", "outgoing"], unless = [{ path = "/etc/ufw/ufw.conf", contains = "ENABLED=yes" }] },
  # KDE Connect / GSConnect pairing and transfers.
  { argv = ["ufw", "allow", "1714:1764/udp"], when = ["kdeconnect"], unless = [{ path = "/etc/ufw/user.rules", contains = "-p udp --dport 1714:1764 -j ACCEPT" }] },
  { argv = ["ufw", "allow", "1714:1764/tcp"], when = ["kdeconnect"], unless = [{ path = "/etc/ufw/user.rules", contains = "-p tcp --dport 1714:1764 -j ACCEPT" }] },
  { argv = ["ufw", "--force", "enable"], unless = [{ path = "/etc/ufw/ufw.conf", contains = "ENABLED=yes" }] },
]
notes = ["Ports published by Docker (`-p`) bypass ufw: Docker inserts its own iptables rules ahead of ufw's. Bind them to 127.0.0.1 or use ufw-docker rules."]

[[module.recipe]]
name = "firewall"
category = "Toggles"
description = "Turn the firewall (ufw) on or off, or show its rules"
admin = true
args = [{ name = "state", choices = ["on", "off", "status"] }]
run = '''
case "$1" in
    on) systemctl enable --now ufw.service; ufw enable ;;
    off) ufw disable; systemctl disable --now ufw.service ;;
    status) ufw status verbose ;;
esac
'''

[[module]]
id = "firewalld"
group = "Firewall"
name = "Firewall (firewalld)"
description = "Zone-based firewall; preferred if you use NetworkManager zones or libvirt."
conflicts = ["ufw"]
packages = ["firewalld"]
enable = ["firewalld.service"]

[[module]]
id = "opensnitch"
group = "Firewall"
name = "Application firewall (OpenSnitch)"
description = "Asks before each app makes a new outgoing connection."
risk = "moderate"
packages = ["opensnitch"]
enable = ["opensnitchd.service"]
notes = ["Start the OpenSnitch UI (opensnitch-ui) so it can show the prompts."]

[[module]]
id = "snapper"
group = "Snapshots"
name = "Btrfs snapshots (snapper)"
description = "Snapshots / before and after every pacman transaction."
risk = "moderate"
when = ["fs:btrfs"]
# On by default where the disk is Btrfs; Timeshift stays a choice elsewhere.
profiles = ["desktop", "gaming", "developer"]
conflicts = ["timeshift"]
packages = ["snapper", "snap-pac"]
# snapper creates /.snapshots itself; when the installer already mounts an
# `@.snapshots` subvolume there, free the mount point first, let snapper
# write its config, then swap its (new, empty) nested subvolume back for the
# mount. Each script checks its own state, so a re-run after a failure
# resumes where it stopped. Snapshots are never deleted: rmdir only removes
# an empty directory, and the nested subvolume is deleted only while empty.
# Done-checks: /etc/conf.d/snapper lists the config (configs/root is 0640);
# /proc/self/mounts shows /.snapshots mounted.
# snapper asks snapperd over the system bus. Setting up the new system from
# the live ISO runs in a chroot, where the bus is the live system's and has no
# snapperd for the new one, so there it works on the files directly
# (--no-dbus); on a running system snapperd must hear of the config.
root_commands = [
  { argv = ["sh", "-ec", """
if systemd-detect-virt -q --chroot; then set -- --no-dbus; else set --; fi
snapper "$@" -c root create-config /"""], when = ["!snapshots-mount"], unless = [{ path = "/etc/conf.d/snapper", contains = 'SNAPPER_CONFIGS="root' }] },
  { argv = ["sh", "-ec", """
if mountpoint -q /.snapshots; then umount /.snapshots; fi
if [ -d /.snapshots ] && ! btrfs subvolume show /.snapshots >/dev/null 2>&1; then rmdir /.snapshots; fi
if systemd-detect-virt -q --chroot; then set -- --no-dbus; else set --; fi
snapper "$@" -c root create-config /"""], when = ["snapshots-mount"], unless = [{ path = "/etc/conf.d/snapper", contains = 'SNAPPER_CONFIGS="root' }] },
  { argv = ["sh", "-ec", """
if mountpoint -q /.snapshots; then exit 0; fi
if btrfs subvolume show /.snapshots >/dev/null 2>&1 && [ -z "$(ls -A /.snapshots)" ]; then btrfs subvolume delete /.snapshots; fi
mkdir -p -m 750 /.snapshots
mount /.snapshots"""], when = ["snapshots-mount"], unless = [{ path = "/proc/self/mounts", contains = " /.snapshots " }] },
]
enable = ["snapper-timeline.timer", "snapper-cleanup.timer"]
notes = ["To boot into snapshots from GRUB, add grub-btrfs too."]

[[module.recipe]]
name = "snapshots"
category = "System"
description = "List the system's snapper snapshots"
admin = true
run = 'snapper -c root list'

[[module.recipe]]
name = "snapshot"
category = "Maintenance"
description = "Take a snapshot of the system now"
admin = true
args = [{ name = "note", kind = "text", default = "bindo", help = "Description to find it by." }]
run = 'snapper -c root create --cleanup-algorithm number --description "$1" --print-number'

[[module.recipe]]
name = "rollback"
category = "System"
description = "Roll the system back to one of its snapshots (from the next start)"
help = "Lists the snapshots and asks which. Your home folder stays as it is; the system as it is now is kept aside (see rollback-cleanup)."
requires = ["bindle"]
run = 'exec bindle rollback'

[[module.recipe]]
name = "rollback-cleanup"
category = "Maintenance"
description = "Delete the systems kept aside by earlier rollbacks"
help = "Once a rolled-back system works as it should, the one it replaced (kept as @.bindle-before-rollback-…) only takes space."
admin = true
confirm = "Delete the systems kept aside by earlier rollbacks? They can't be gone back to afterwards."
run = '''
dev=$(findmnt -no SOURCE / | sed 's/\[.*//')
top=$(mktemp -d)
mount -o subvolid=5 "$dev" "$top"
trap 'umount "$top"; rmdir "$top"' EXIT
found=0
for s in "$top"/*.bindle-before-rollback-*; do
    [ -d "$s" ] || continue
    found=1
    echo "Deleting ${s##*/}"
    btrfs subvolume delete --recursive "$s"
done
[ "$found" = 1 ] || echo "No system kept aside by a rollback."
'''

[[module]]
id = "grub-btrfs"
group = "Snapshots"
name = "Boot into snapshots (grub-btrfs)"
description = "Adds snapper snapshots to the GRUB menu and keeps them current as snapshots come and go."
risk = "moderate"
when = ["fs:btrfs", "boot:grub"]
requires = ["snapper"]
packages = ["grub-btrfs", "inotify-tools"]
enable = ["grub-btrfsd.service"]
root_commands = [["grub-mkconfig", "-o", "/boot/grub/grub.cfg"]]

[[module]]
id = "timeshift"
group = "Snapshots"
name = "System snapshots (Timeshift)"
description = "Scheduled system snapshots with a GUI, on ext4 (rsync) or Btrfs."
conflicts = ["snapper"]
packages = ["timeshift"]
notes = ["Open Timeshift once to pick the snapshot location and schedule."]

[[module]]
id = "btrfs-maintenance"
group = "Snapshots"
name = "Btrfs scrub"
description = "Monthly scrub of the root filesystem to find (and, with redundancy, repair) silent corruption."
when = ["fs:btrfs"]
packages = ["btrfsmaintenance"]
enable = ["btrfs-scrub.timer"]
notes = ["Schedules and mount points are in /etc/default/btrfsmaintenance."]

[[module]]
id = "secure-boot-tools"
group = "Hardening & scans"
name = "Secure Boot tools (sbctl)"
description = "sbctl, to create and enroll your own Secure Boot keys. Nothing is enrolled automatically."
risk = "advanced"
when = ["!virt"]
packages = ["sbctl"]
notes = ["Put the firmware in Setup Mode, then: sbctl create-keys; sbctl enroll-keys -m; sbctl verify; sign what it lists with sbctl sign -s. Read the Arch Wiki Secure Boot page first: a mistake can stop the machine booting."]

[[module]]
id = "oysterav"
group = "Hardening & scans"
name = "oysterAV (security scans)"
description = "One GUI and CLI over ClamAV, rkhunter, Lynis and friends. By asafelobotomy."
profiles = ["desktop", "gaming", "developer"]
requires = ["aur-helper"]
aur = ["oysterav", "chkrootkit"]
# What oysterAV scans with, ready to go: ClamAV with its signature updater running (it downloads
# the signatures as soon as it starts), rkhunter, chkrootkit and unhide for the rootkit checks, and Lynis for
# the hardening audit. Those checks run as root from the distro packages only, never oysterAV's private copies.
# The firewall is the ufw module above.
packages = ["clamav", "rkhunter", "unhide", "lynis"]
enable = ["clamav-freshclam.service"]
notes = ["ClamAV downloads its virus signatures right after install; oysterAV shows \"no virus signatures\" until that has finished. Open oysterAV from your app menu for the rest."]

[[module]]
id = "keepassxc"
group = "Passwords"
name = "KeePassXC"
description = "Offline password manager with browser integration."
packages = ["keepassxc"]

[[module]]
id = "bitwarden"
group = "Passwords"
name = "Bitwarden"
description = "Desktop client for the Bitwarden password manager."
packages = ["bitwarden"]

[[module]]
id = "backup-gtk"
group = "Backups"
name = "Backups (Pika Backup)"
description = "Deduplicated, encrypted backups of your home folder (BorgBackup)."
when = ["toolkit:gtk"]
packages = ["pika-backup"]

[[module]]
id = "backup-deja-dup"
group = "Backups"
name = "Backups (Déjà Dup)"
description = "Simple scheduled backups to a drive or the cloud."
packages = ["deja-dup"]

# Kernel settings that close small holes without touching anything a desktop
# uses: no ptrace or user-namespace limits (debuggers, Flatpak, Steam and
# browsers need those), no lockdown (hibernation, NVIDIA's modules).
[[module]]
id = "kernel-hardening"
group = "Hardening & scans"
name = "Light kernel hardening"
description = "Hides kernel addresses, ignores network redirects and protects shared folders from file tricks, without breaking apps, games or Flatpaks."
default = true
files = [{ path = "/etc/sysctl.d/60-bindle-hardening.conf", content = '''
# Managed by Bindle
kernel.kptr_restrict = 1
dev.tty.ldisc_autoload = 0
fs.protected_regular = 2
fs.protected_fifos = 2
net.ipv4.tcp_rfc1337 = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
''' }]

[[module]]
id = "gentle-lockout"
group = "Hardening & scans"
name = "Gentler lockout after wrong passwords"
description = "5 wrong passwords lock the account for 2 minutes, instead of 3 locking it for 10 (a common lock-screen annoyance)."
risk = "moderate"
root_commands = [{ argv = ["sh", "-ec", '''
f=/etc/security/faillock.conf
sed -i -E 's/^#? *deny *=.*/deny = 5/; s/^#? *unlock_time *=.*/unlock_time = 120/' "$f"
grep -q '^deny = 5' "$f" || echo 'deny = 5' >>"$f"
grep -q '^unlock_time = 120' "$f" || echo 'unlock_time = 120' >>"$f"
'''], unless = [{ path = "/etc/security/faillock.conf", contains = "unlock_time = 120" }] }]

[[module]]
id = "wifi-mac-privacy"
group = "Hardening & scans"
name = "Hide your Wi-Fi address from networks"
description = "Scans use random addresses and each Wi-Fi network sees its own fixed one, so you can't be tracked between networks."
when = ["nm", "wifi"]
risk = "moderate"
files = [{ path = "/etc/NetworkManager/conf.d/50-bindle-mac.conf", content = "# Managed by Bindle\n[device]\nwifi.scan-rand-mac-address=yes\n\n[connection]\nwifi.cloned-mac-address=stable\n" }]
notes = ["Networks that know your device by its address (a home router's reservations, some captive portals) will see a new one."]

[[module]]
id = "firejail"
group = "Hardening & scans"
name = "App sandboxing (firejail)"
description = "Run an untrusted program in a sandbox: firejail <program>. Your app launchers stay as they are."
risk = "moderate"
packages = ["firejail"]

[[module]]
id = "auditd"
group = "Hardening & scans"
name = "Security audit log (auditd)"
description = "Records security events (logins, permission changes, rule hits) in /var/log/audit, for servers and compliance."
packages = ["audit"]
enable = ["auditd.service"]
