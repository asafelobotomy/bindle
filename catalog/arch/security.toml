[category]
id = "security"
name = "Security"
description = "Firewalls, snapshots and backups."
order = 70

[[module]]
id = "ufw"
name = "Firewall (ufw)"
description = "Blocks incoming connections and allows outgoing ones."
profiles = ["desktop", "gaming", "developer"]
conflicts = ["firewalld"]
packages = ["ufw"]
enable = ["ufw.service"]
# Each command is skipped once its effect is on disk, so re-applying is a no-op.
root_commands = [
  { argv = ["ufw", "default", "deny", "incoming"], unless = [{ path = "/etc/ufw/ufw.conf", contains = "ENABLED=yes" }] },
  { argv = ["ufw", "default", "allow", "outgoing"], unless = [{ path = "/etc/ufw/ufw.conf", contains = "ENABLED=yes" }] },
  # KDE Connect / GSConnect pairing and transfers.
  { argv = ["ufw", "allow", "1714:1764/udp"], when = ["kdeconnect"], unless = [{ path = "/etc/ufw/user.rules", contains = "-p udp --dport 1714:1764 -j ACCEPT" }] },
  { argv = ["ufw", "allow", "1714:1764/tcp"], when = ["kdeconnect"], unless = [{ path = "/etc/ufw/user.rules", contains = "-p tcp --dport 1714:1764 -j ACCEPT" }] },
  { argv = ["ufw", "--force", "enable"], unless = [{ path = "/etc/ufw/ufw.conf", contains = "ENABLED=yes" }] },
]
notes = ["Ports published by Docker (`-p`) bypass ufw: Docker inserts its own iptables rules ahead of ufw's. Bind them to 127.0.0.1 or use ufw-docker rules."]

[[module]]
id = "firewalld"
name = "Firewall (firewalld)"
description = "Zone-based firewall; preferred if you use NetworkManager zones or libvirt."
conflicts = ["ufw"]
packages = ["firewalld"]
enable = ["firewalld.service"]

[[module]]
id = "opensnitch"
name = "Application firewall (OpenSnitch)"
description = "Asks before each app makes a new outgoing connection."
risk = "moderate"
packages = ["opensnitch"]
enable = ["opensnitchd.service"]
notes = ["Start the OpenSnitch UI (opensnitch-ui) so it can show the prompts."]

[[module]]
id = "snapper"
name = "Btrfs snapshots (snapper)"
description = "Snapshots / before and after every pacman transaction."
risk = "moderate"
when = ["fs:btrfs"]
conflicts = ["timeshift"]
packages = ["snapper", "snap-pac"]
# snapper creates /.snapshots itself; when the installer already mounts an
# `@.snapshots` subvolume there, free the mount point first, let snapper
# write its config, then swap its (new, empty) nested subvolume back for the
# mount. Each script checks its own state, so a re-run after a failure
# resumes where it stopped. Snapshots are never deleted: rmdir only removes
# an empty directory, and the nested subvolume is deleted only while empty.
# Done-checks: /etc/conf.d/snapper lists the config (configs/root is 0640);
# /proc/self/mounts shows /.snapshots mounted.
root_commands = [
  { argv = ["snapper", "-c", "root", "create-config", "/"], when = ["!snapshots-mount"], unless = [{ path = "/etc/conf.d/snapper", contains = 'SNAPPER_CONFIGS="root' }] },
  { argv = ["sh", "-ec", """
if mountpoint -q /.snapshots; then umount /.snapshots; fi
if [ -d /.snapshots ] && ! btrfs subvolume show /.snapshots >/dev/null 2>&1; then rmdir /.snapshots; fi
snapper -c root create-config /"""], when = ["snapshots-mount"], unless = [{ path = "/etc/conf.d/snapper", contains = 'SNAPPER_CONFIGS="root' }] },
  { argv = ["sh", "-ec", """
if mountpoint -q /.snapshots; then exit 0; fi
if btrfs subvolume show /.snapshots >/dev/null 2>&1 && [ -z "$(ls -A /.snapshots)" ]; then btrfs subvolume delete /.snapshots; fi
mkdir -p -m 750 /.snapshots
mount /.snapshots"""], when = ["snapshots-mount"], unless = [{ path = "/proc/self/mounts", contains = " /.snapshots " }] },
]
enable = ["snapper-timeline.timer", "snapper-cleanup.timer"]
notes = ["To boot into snapshots from GRUB, add grub-btrfs too."]

[[module]]
id = "grub-btrfs"
name = "Boot into snapshots (grub-btrfs)"
description = "Adds snapper snapshots to the GRUB menu and keeps them current as snapshots come and go."
risk = "moderate"
when = ["fs:btrfs", "boot:grub"]
requires = ["snapper"]
packages = ["grub-btrfs", "inotify-tools"]
enable = ["grub-btrfsd.service"]
root_commands = [["grub-mkconfig", "-o", "/boot/grub/grub.cfg"]]

[[module]]
id = "timeshift"
name = "System snapshots (Timeshift)"
description = "Scheduled system snapshots with a GUI, on ext4 (rsync) or Btrfs."
conflicts = ["snapper"]
packages = ["timeshift"]
notes = ["Open Timeshift once to pick the snapshot location and schedule."]

[[module]]
id = "btrfs-maintenance"
name = "Btrfs scrub"
description = "Monthly scrub of the root filesystem to find (and, with redundancy, repair) silent corruption."
when = ["fs:btrfs"]
packages = ["btrfsmaintenance"]
enable = ["btrfs-scrub.timer"]
notes = ["Schedules and mount points are in /etc/default/btrfsmaintenance."]

[[module]]
id = "secure-boot-tools"
name = "Secure Boot tools (sbctl)"
description = "sbctl, to create and enroll your own Secure Boot keys. Nothing is enrolled automatically."
risk = "advanced"
when = ["!virt"]
packages = ["sbctl"]
notes = ["Put the firmware in Setup Mode, then: sbctl create-keys; sbctl enroll-keys -m; sbctl verify; sign what it lists with sbctl sign -s. Read the Arch Wiki Secure Boot page first: a mistake can stop the machine booting."]

[[module]]
id = "oysterav"
name = "oysterAV (security scans)"
description = "One GUI and CLI over ClamAV, rkhunter, Lynis and friends. By asafelobotomy."
requires = ["aur-helper"]
aur = ["oysterav"]
notes = ["Set it up with `oyst-cli setup run`, or open oysterAV from your app menu."]
