# More of Base: small defaults most systems want, each one drop-in file or package.
extends = "base"

[[module]]
id = "log-limits"
group = "Firmware & upkeep"
name = "Keep logs and crash dumps small"
description = "The system journal and saved crash dumps each stay under 1 GB, so they never slowly fill the disk (Arch allows the journal 4 GB)."
default = true
files = [
  { path = "/etc/systemd/journald.conf.d/50-bindle.conf", content = "# Managed by Bindle\n[Journal]\nSystemMaxUse=1G\n" },
  { path = "/etc/systemd/coredump.conf.d/50-bindle.conf", content = "# Managed by Bindle\n[Coredump]\nMaxUse=1G\n" },
]

[[module]]
id = "kernel-modules-hook"
group = "Firmware & upkeep"
name = "Keep drivers working after a kernel update"
description = "After a kernel update, USB sticks, VPNs and other drivers still load until you restart (the running kernel's modules are kept, then cleaned up)."
default = true
packages = ["kernel-modules-hook"]
enable = ["linux-modules-cleanup.service"]

[[module]]
id = "boot-guard"
group = "Firmware & upkeep"
name = "Stop a kernel update from breaking the next boot"
description = "Refuses a kernel update while the boot partition isn't mounted, and warns after one when a boot image holds a kernel that is no longer installed (the cause of a boot that can't mount /boot)."
default = true
packages = ["binutils"]
files = [
  { path = "/etc/pacman.d/hooks/00-bindle-boot-mounted.hook", content = '''
# Managed by Bindle
[Trigger]
Operation = Install
Operation = Upgrade
Operation = Remove
Type = Path
Target = usr/lib/modules/*/vmlinuz

[Trigger]
Operation = Install
Operation = Upgrade
Operation = Remove
Type = Package
Target = mkinitcpio

[Action]
Description = Checking that the boot partition is mounted...
When = PreTransaction
Exec = /bin/sh -c 'for m in /boot /efi; do if findmnt -n --fstab "$m" >/dev/null 2>&1 && ! mountpoint -q "$m"; then echo "bindle: $m is not mounted: mount it, then update again." >&2; exit 1; fi; done'
AbortOnFail
''' },
  { path = "/usr/local/libexec/bindle/boot-guard-check", source = "boot-guard-check.sh", mode = 0o755 },
  { path = "/etc/pacman.d/hooks/zz-bindle-boot-check.hook", content = '''
# Managed by Bindle
[Trigger]
Operation = Install
Operation = Upgrade
Operation = Remove
Type = Path
Target = usr/lib/modules/*/vmlinuz

[Action]
Description = Checking that the boot images match the installed kernels...
When = PostTransaction
Exec = /usr/local/libexec/bindle/boot-guard-check
Depends = binutils
''' },
]

[[module.recipe]]
name = "boot-guard"
category = "Diagnose"
description = "Check that every boot image holds an installed kernel"
args = []
run = '''
out=$(/usr/local/libexec/bindle/boot-guard-check 2>&1)
if [ -n "$out" ]; then printf '%s\n' "$out"; exit 1; fi
echo "ok"
'''

[[module]]
id = "pacnew-notice"
group = "Package manager"
name = "Point out new config files after updates"
description = "After each update, lists the .pacnew files it left (new versions of config files you changed), to merge with bindo pacnew."
default = true
packages = ["pacman-contrib"]
files = [{ path = "/etc/pacman.d/hooks/zz-bindle-pacnew.hook", content = '''
# Managed by Bindle
[Trigger]
Operation = Upgrade
Type = Package
Target = *

[Action]
Description = New config files to merge (bindo pacnew):
When = PostTransaction
Exec = /usr/bin/pacdiff --output
Depends = pacman-contrib
''' }]

[[module]]
id = "quick-shutdown"
group = "Firmware & upkeep"
name = "Shut down without long waits"
description = "A service that won't stop gets 15 seconds instead of 90, so shutdown no longer hangs on \"A stop job is running\"."
when = ["desktop"]
profiles = ["desktop", "gaming", "developer"]
risk = "moderate"
files = [
  { path = "/etc/systemd/system.conf.d/10-bindle-timeout.conf", content = "# Managed by Bindle\n[Manager]\nDefaultTimeoutStopSec=15s\n" },
  { path = "/etc/systemd/user.conf.d/10-bindle-timeout.conf", content = "# Managed by Bindle\n[Manager]\nDefaultTimeoutStopSec=15s\n" },
]
