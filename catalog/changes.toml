[[added]]
version = "0.1.13"
modules = ["boot-guard"]
why = "New in Bindle 0.1.13: a guard for kernel updates. It refuses a kernel update while the boot partition isn't mounted, and warns when a boot image holds a kernel that is no longer installed, which can leave you at an emergency prompt after a restart."

[[added]]
version = "0.1.30"
modules = ["reelo"]
why = "New in Bindle 0.1.30: reelo, uQ's own media player. It plays video, music and streams with mpv's engine, follows the uQ theme, shows in uQ's media controls and lists your newest downloads. It becomes the default player unless you picked one other than VLC or mpv."

[[added]]
version = "0.1.35"
modules = ["uqbit"]
why = "New in Bindle 0.1.35: uQbit, uQ's own torrent app. It runs qBittorrent Enhanced Edition's headless engine in the background with a window that follows the uQ theme, and opens magnet links and .torrent files instead of the qBittorrent window."

[[added]]
version = "0.1.37"
modules = ["kyko"]
why = "New in Bindle 0.1.37: kyko is back, as uQ's terminal in place of kitty: images, ligatures, splits, sessions that survive a restart and a drop-down mode."

[[added]]
version = "0.1.41"
modules = ["zsh", "fzf-tab"]
why = "New in Bindle 0.1.41: Zsh now comes with suggestions as you type, syntax highlighting and history search on Up and Down, which kyko turns on when your .zshrc doesn't, and fzf-tab makes its completion menu a fuzzy search."

[[added]]
version = "0.1.43"
modules = ["uqview"]
why = "uQview, uQ's picture viewer, joined uQ's apps in Bindle 0.1.31 but was never offered to setups made before it: it opens pictures in uQ's theme, marks up screenshots and sets a picture as the wallpaper. It becomes the app for pictures only if you haven't chosen one."

[[added]]
version = "0.1.49"
modules = ["bindle"]
why = "New in Bindle 0.1.49: Bindle itself comes from its AUR package once an AUR helper is in, and updates with your other AUR packages. bindle, bindleup and bindo keep working by the same names."

[[added]]
version = "0.1.52"
modules = ["reshadelinux", "qbit-plugin-dl"]
why = "Back in Bindle 0.1.52, now from the AUR: ReShadeLinux (ReShade for Wine and Proton games) and qbit Plugin Manager (qBittorrent search plugins). A copy Bindle installed as an AppImage is replaced by the package."
