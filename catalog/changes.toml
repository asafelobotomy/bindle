# What a diff of the catalog can't tell "What's new" (crates/bindle-core/src/whatsnew).
# Validated by the unit tests against the catalog.
#
# [[renamed]]   a module id that changed: what was applied under `from` counts as `to`.
#   from, to, version, why
# [[retired]]   a module that left the catalog: offered as a clean-up (its files and units).
#   id, version, why, replaced_by (optional, a module id)
# [[added]]     optional modules worth showing to people upgrading to `version`
#   (modules their profile already includes show up anyway, ticked).
#   version, modules, why

[[added]]
version = "0.1.9"
modules = ["everyday-apps", "spellcheck", "disk-formats", "appimage", "bash-completion", "vpn-plugins", "text-editor", "xournalpp", "marknote", "nvidia-legacy", "copyq"]
why = "New in Bindle 0.1.9: everyday apps, spell checking, USB drive formats, AppImage support, tab completion, VPN plugins, notes and handwriting apps, clipboard history, and NVIDIA's driver for older cards."

[[retired]]
id = "clipboard-history"
version = "0.1.10"
replaced_by = "copyq"
why = "Clipboard history is now CopyQ everywhere Bindle sets it up: a tray icon to paste from, and items that go after 30, 60 or 90 days."

[[added]]
version = "0.1.10"
modules = ["flatpak-bazaar", "flatseal", "warehouse", "screenshots", "copyq"]
why = "New in Bindle 0.1.10: Bazaar as the Flathub app store, Flatseal and Warehouse for your Flatpaks, screenshots of an area on Print, and clipboard history in the tray."

[[added]]
version = "0.1.10"
modules = ["thrash-guard", "btrfs-noatime", "gentle-lockout", "wifi-mac-privacy", "firejail", "auditd", "night-light", "firefox-privacy", "firefox-nvidia", "gpg-pinentry", "realtime-audio", "thunderbolt", "thunderbolt-plasma", "fingerprint-sudo", "coolercontrol", "monitor-brightness", "mipi-camera", "security-keys", "console-font", "controller-rules", "xpadneo", "charge-limit", "asusctl", "throttled", "framework", "dell-smbios", "handheld", "sensors", "pen-tablet", "hp-devices", "epson-scan", "log-limits", "kernel-modules-hook", "pacnew-notice", "quick-shutdown", "writeback", "nmi-watchdog-off", "audio-no-powersave", "wifi-region", "kernel-hardening", "ntsync", "shader-cache", "keyring-at-login", "kwallet-at-login", "kwallet-at-login-wm", "default-file-manager", "file-search-names", "dolphin-video-thumbnails", "ssh-agent", "browser-video-decoding", "flatpak-theme", "uniform-theme", "qt-follows-gtk", "cjk-fonts", "bash-extras", "idle-lock-sway", "idle-lock-niri", "captive-portal"]
why = "Also new in Bindle 0.1.10: everyday defaults from the ArchWiki and other distros: Wi-Fi rules for your country, smaller logs, drivers that keep working after a kernel update, smoother copies, light kernel hardening, keyrings unlocked at login, folders opening in the file manager, file search by name outside Plasma, hardware video in Chromium browsers, one look for Qt, GTK and Flatpak apps, faster Windows games, and screen locking on Sway and niri. And hardware Bindle now recognises: Thunderbolt docks, external monitor brightness, fan control, fingerprint for sudo, newer Intel laptop webcams, security keys, a bigger console font on high-resolution screens, ASUS ROG/TUF, ThinkPad, Framework and Dell tools, handheld gaming PCs, tablets and scanners. Plus opt-in choices: no freezing when memory runs out, night light, Firefox without telemetry, hardware video in Firefox on NVIDIA, a gentler password lockout, Wi-Fi address privacy, sandboxing and real-time audio."

[[retired]]
id = "kyko"
version = "0.1.11"
why = "Bindle now installs only stable releases, and kyko has had preview releases only so far. It comes back once it has a stable one. A kyko you already have stays installed."

[[retired]]
