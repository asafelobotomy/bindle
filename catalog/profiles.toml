# Profiles pre-select modules in the wizard. A module joins a profile when it
# lists the profile id in `profiles`, or when it sets `default = true`.
# `addon = true`: the desktop wizard offers it on top of a base profile.

[[profile]]
id = "minimal"
name = "Minimal"
description = "Only the safe defaults every install benefits from."

[[profile]]
id = "desktop"
name = "Desktop"
description = "Everyday desktop: audio, fonts, codecs, Flatpak, power and a firewall."

[[profile]]
id = "gaming"
addon = true
name = "Gaming"
description = "Desktop plus Steam, Wine, GameMode, MangoHud, gamescope, Protontricks."

[[profile]]
id = "developer"
addon = true
name = "Developer"
description = "Desktop plus languages, Docker, Neovim, Git and modern CLI tools."
