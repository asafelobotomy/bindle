# cargo-deny: dependency policy (`cargo deny check`; CI runs it on every push and weekly).
[advisories]
# zbus 5's zvariant/zbus_names/zvariant_derive are flagged "unmaintained" (no
# vulnerability): they were merged into zbus 6. Drop these once notify.rs moves to zbus 6.
ignore = ["RUSTSEC-2026-0370", "RUSTSEC-2026-0371", "RUSTSEC-2026-0372"]
yanked = "deny"

[licenses]
# All must be compatible with Bindle's GPL-3.0-or-later.
allow = ["GPL-3.0-or-later", "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "Zlib", "Unlicense", "BSL-1.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
